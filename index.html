/* ================= 状态 ================= */
var W=1.5;
const S={}; CARDS.forEach(c=>S[c.id]={mode:'h24'});
const basket={};
const RES={iv:0.2, et:0.75};
const META={bed:'',name:'',hosp:'',gaw:'',gad:'',dol:''};

/* ================= CALC：纯函数，唯一真源 ================= */
function f(x,n=2){let s=Number(x).toFixed(n); if(s.indexOf('.')>-1)s=s.replace(/0+$/,'').replace(/\.$/,''); return s;}
function f2(x){return f(x,2);}
function isPerMin(g){return g.unit.indexOf('min')>-1;}
function niceRate(x){if(!(x>0))return 0.05; let n=Math.round(x*20)/20; if(n<x&&(x-n)/x>0.05)n=(Math.round(n*20)+1)/20; return Math.max(0.05,n);}
function rateOf(dose,g){return g.dynamic?1:dose/g.rateDiv;}
function amt(mg){return mg>=1? f(mg,2)+'mg' : f(mg*1000,1)+'μg';}
function unitTail(g){return g.unit==='μg/kg/h'?'hr':'min';}

/* 维持·按24小时配（特利=12h袋） */
function calcH24(c){
  const g=DRUGS[c.drug], s=S[c.id], pm=isPerMin(g);
  const dEl=parseFloat($('din_'+c.id).value);
  const dose=(isFinite(dEl)&&dEl>0)?dEl:g.def;
  if(g.dynamic){
    const bagMg=dose*W*12/1000;
    return {t1:`特利加压素${f(bagMg,2)}mg，入0.9%氯化钠至12ml，1ml/h`,
      prep:[`特利加压素 ${f(bagMg,2)}mg/12h`,`0.9%氯化钠或5%葡萄糖 至12ml`],
      ck:[`剂量核对：${f(dose,2)} μg/kg/h×${W.toFixed(2)}kg×12h＝<b>${f(bagMg,2)}mg</b>（12h袋）`,
          `液体核对：泵速<b>1ml/h</b>；12小时入液<b>12ml</b>`]};
  }
  const rEl=parseFloat($('rin_'+c.id).value);
  const R=(isFinite(rEl)&&rEl>0)?rEl:niceRate(rateOf(dose,g));
  const mg24=dose*W*(pm?1.44:24/1000), mcgH=dose*W;
  const ck1=pm
    ? `剂量核对：${f(dose,2)} ${g.unit}×${W.toFixed(2)}kg×60分钟×24h＝<b>${amt(mg24)}/24h</b>（${f(mcgH,0)}μg/h）`
    : `剂量核对：${f(dose,2)} ${g.unit}×${W.toFixed(2)}kg×24h＝<b>${amt(mg24)}/24h</b>（${f(mcgH,2)}μg/h）`;
  return {t1:`${g.name}${f2(R)}ml/h=${f(dose,2)}ug/kg/${unitTail(g)}，维持24小时`,
    prep:[`${g.name} ${amt(mg24)}/24h`,`0.9%氯化钠或5%葡萄糖 ${f2(R*24)}ml/24h`],
    ck:[ck1,`液体核对：泵速<b>${f2(R)}ml/h</b>；24小时入液<b>${f2(R*24)}ml</b>`]};
}
/* 维持·按整支配（固定整支药量，泵速→稀释体积反算） */
function calcAmp(c){
  const g=DRUGS[c.drug], pm=isPerMin(g);
  const dEl=parseFloat($('din_'+c.id).value);
  const dose=(isFinite(dEl)&&dEl>0)?dEl:g.def;
  const rEl=parseFloat($('arin_'+c.id).value);
  const R=(isFinite(rEl)&&rEl>0)?rEl:niceRate(rateOf(dose,g));
  const M=g.specMg;
  const Cneed=dose*W*(pm?60:1)/(R*1000);          /* mg/ml */
  let V=M/Cneed; V=Math.max(2,Math.ceil(V*2)/2);  /* 0.5ml取整，宁多勿少 */
  const stockMl=M/g.stockConc;
  const water=Math.max(0,V-stockMl);
  const C1=M/V;
  const act=R*C1*1000/(W*(pm?60:1));
  const dur=V/R;
  const t1=g.dynamic
    ? `特利加压素${f(M,2)}mg，入0.9%氯化钠至${f(V,0)}ml，${f2(R)}ml/h`
    : `${g.name}${f2(R)}ml/h=${f(act,2)}ug/kg/${unitTail(g)}`;
  return {t1,
    prep:[`${g.name} ${f(M,2)}mg`,`0.9%氯化钠或5%葡萄糖 ${f(water,1)}ml → 共 ${f(V,1)}ml`],
    ck:[`剂量核对：泵速<b>${f2(R)}ml/h</b>＝<b>${f(act,2)} ${g.unit}</b>；可维持${f(dur,0)}h`,
        `液体核对：泵速${f2(R)}ml/h；24小时入液${f2(R*24)}ml`]};
}
/* 静推/首剂/复苏 */
function calcPush(c){
  const g=DRUGS[c.drug];
  if(c.drug==='fentanyl'){
    const dEl=parseFloat($('din_'+c.id).value), dose=(isFinite(dEl)&&dEl>0)?dEl:2, a=dose*W;
    return {t1:`芬太尼 ${f2(a)}μg 静推 st`,t2:`＝${dose}μg/kg · 缓推≥3min · 备气囊`,
      ck:[`剂量核对：${dose}μg/kg×${W.toFixed(2)}kg＝<b>${f2(a)}μg</b>`]};
  }
  if(c.drug==='midazolam'){
    const dEl=parseFloat($('din_'+c.id).value), dose=(isFinite(dEl)&&dEl>0)?dEl:0.1, a=dose*W;
    return {t1:`咪达唑仑 ${f2(a)}mg 静推 st`,t2:`＝${dose}mg/kg · 缓推≥2min · 监测血压`,
      ck:[`剂量核对：${dose}mg/kg×${W.toFixed(2)}kg＝<b>${f2(a)}mg</b>`]};
  }
  const dEl=parseFloat($('din_'+c.id).value), dose=(isFinite(dEl)&&dEl>0)?dEl:0.1, a=dose*W;
  return {t1:`维库溴铵 ${f2(a)}mg 静推 st`,t2:`＝${dose}mg/kg · 镇静确保后给 · 呼吸机下`,
    ck:[`剂量核对：${dose}mg/kg×${W.toFixed(2)}kg＝<b>${f2(a)}mg</b>`]};
}
function calcResus(rt){
  const d=RES[rt]||((rt==='iv')?0.2:0.75);
  const ml=d*W, mg=ml*0.1;
  const t1= rt==='iv'? `1:10000肾上腺素 ${f2(ml)}ml 静推 st` : `1:10000肾上腺素 ${f2(ml)}ml 气管内滴入 st`;
  const t2= rt==='iv'? `${Math.round(d*100)}μg/kg＝${f2(mg)}mg · q3–5min可重复 · 推注≥1分钟`
                     : `${f(d,2)}ml/kg＝${f2(mg)}mg · 0.05–0.1mg/kg · 滴后气囊加压数次 · 尽快建立静脉`;
  return {t1,t2,ck:[`剂量核对：${d}ml/kg×${W.toFixed(2)}kg＝<b>${f2(ml)}ml</b>＝${f2(mg)}mg`]};
}

/* 医嘱篮取行：按卡当前模式（唯一入口，医嘱单/长图/复制共用） */
function linesOf(key){
  if(key.indexOf('@')>-1){
    const [cid,rt]=key.split('@');
    if(cid==='epi_resus'){const L=calcResus(rt); return {t1:L.t1,prep:[L.t2],ck:L.ck};}
  }
  const c=CARDS.find(x=>x.id===key); if(!c)return null;
  if(c.kind==='push'){const L=calcPush(c); return {t1:L.t1,prep:[L.t2],ck:L.ck};}
  return S[c.id].mode==='amp'? calcAmp(c) : calcH24(c);
}

      <div class="labeq">剂量 <input data-act="dose" data-card="${c.id}" id="din_${c.id}" type="number" inputmode="decimal" step="${g.step}" min="0" value="${g.def}"> ${g.unit}</div>
      <div class="modetabs" id="mt_${c.id}">
        <button data-act="mode" data-card="${c.id}" data-mode="h24" class="on">${tab1}</button>
        <button data-act="mode" data-card="${c.id}" data-mode="amp">按整支配</button>
      </div>
      <div id="sec_h24_${c.id}">
        ${g.dynamic?'':`<div class="labeq">泵速 <input data-act="rate" data-card="${c.id}" id="rin_${c.id}" type="number" inputmode="decimal" step="0.05" min="0" value="${defR}"> ml/h</div>`}
        <div class="ordbox" id="ord_${c.id}"></div>
        <div class="ckbox"><div class="t">核对（体重 <span class="ckw_${c.id}">—</span>kg）</div><div id="ckr_${c.id}"></div></div>
      </div>
      <div id="sec_amp_${c.id}" style="display:none">
        <div class="labeq">泵速 <input data-act="amprate" data-card="${c.id}" id="arin_${c.id}" type="number" inputmode="decimal" step="0.05" min="0" value="${defR}"> ml/h</div>
        <div class="ordbox" id="aord_${c.id}"></div>
        <div class="ckbox"><div class="t">核对（体重 <span class="ckw2_${c.id}">—</span>kg）</div><div id="ackr_${c.id}"></div></div>
      </div>
      ${doseInfoHtml(g)}
      <div class="btnrow"><button class="btn pri" data-act="add" data-key="${c.id}" id="add_${c.id}">＋ 加医嘱</button></div>
      ${moreHtml(g)}
    </div>
  </div>`;
}
function pushHtml(c){
  const g=DRUGS[c.drug];
  const u=c.drug==='fentanyl'?'μg/kg':'mg/kg';
  const def=c.drug==='fentanyl'?2:0.1;
  const step=c.drug==='fentanyl'?0.5:0.05;
  return `<div class="card" id="card_${c.id}">
    <div class="chead" data-act="cap" data-card="${c.id}">
      <span class="tri" id="tri_${c.id}">▸</span>
      <span class="ct">${c.title}</span><span class="en">${g.en}</span>
      <span class="cspec">${g.spec}</span>
    </div>
    <div class="cbody" id="body_${c.id}" style="display:none">
      <div class="labeq">剂量 <input data-act="dose" data-card="${c.id}" id="din_${c.id}" type="number" inputmode="decimal" step="${step}" min="0" value="${def}"> ${u}</div>
      <div class="ordbox" id="ord_${c.id}"></div>
      <div class="ckbox"><div class="t">核对（体重 <span class="ckw_${c.id}">—</span>kg）</div><div id="ckr_${c.id}"></div></div>
      <div class="btnrow"><button class="btn pri" data-act="add" data-key="${c.id}" id="add_${c.id}">＋ 加医嘱</button></div>
      ${moreHtml(g)}
    </div>
  </div>`;
}
function resusHtml(c){
  return `<div class="card redcard" id="card_${c.id}">
    <div class="chead" data-act="cap" data-card="${c.id}">
      <span class="tri" id="tri_${c.id}">▸</span>
      <span class="ct">${c.title}</span><span class="en">Epinephrine</span>
      <span class="cspec">1mg/1ml</span>
    </div>
    <div class="cbody" id="body_${c.id}" style="display:none">
      <div class="spec">配液：<b>1mg＋NS 9ml→10ml</b>（1:10000，现配现用、标注时间）</div>
      <div class="redsec">
        <div class="redsec_t">① 静推（IV/IO）</div>
        <div class="labeq">剂量 <input data-act="resus" data-rt="iv" id="din_${c.id}_iv" type="number" inputmode="decimal" step="0.05" min="0.05" max="0.3" value="0.2"> ml/kg（0.1–0.3＝0.01–0.03mg/kg）</div>
        <div class="ordbox" id="ord_${c.id}_iv"></div>
        <div class="ckbox"><div class="t">核对（体重 <span id="ckw_${c.id}_iv">—</span>kg）</div><div id="ckr_${c.id}_iv"></div></div>
        <div class="btnrow"><button class="btn red" data-act="add" data-key="${c.id}@iv" id="add_${c.id}_iv">＋ 复苏静推加医嘱</button></div>
        <div class="note">q3–5min 可重复；正压通气＋胸外按压下给药；推注≥1分钟；外渗→酚妥拉明局部浸润</div>
      </div>
      <div class="redsec">
        <div class="redsec_t">② 气管内（ET）—— 无静脉通路时</div>
        <div class="labeq">剂量 <input data-act="resus" data-rt="et" id="din_${c.id}_et" type="number" inputmode="decimal" step="0.05" min="0.5" max="1" value="0.75"> ml/kg（0.5–1＝0.05–0.1mg/kg）</div>
        <div class="ordbox" id="ord_${c.id}_et"></div>
        <div class="ckbox"><div class="t">核对（体重 <span id="ckw_${c.id}_et">—</span>kg）</div><div id="ckr_${c.id}_et"></div></div>
        <div class="btnrow"><button class="btn pri" data-act="add" data-key="${c.id}@et" id="add_${c.id}_et">＋ 气管内加医嘱</button></div>
        <div class="note">滴入后气囊加压数次促吸收；吸收不稳定→尽快建立静脉/骨髓腔通路</div>
      </div>
    </div>
  </div>`;
}
function renderCards(){
  $('holder0').innerHTML=CARDS.map(c=>c.kind==='resus'?resusHtml(c):(c.kind==='push'?pushHtml(c):maintHtml(c))).join('');
}

/* 单卡刷新：按 kind 分流，calc 函数只在拥有对应输入框的卡上调用 */
function updCard(id){
  const c=CARDS.find(x=>x.id===id); if(!c)return;
  const g=DRUGS[c.drug];
  if(c.kind==='push'){
    const L=calcPush(c);
    $('ord_'+id).innerHTML=`<div class="o1">${L.t1}</div><div class="o2">${L.t2}</div>`;
    $('ckr_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
    return;
  }
  if(c.kind==='resus'){
    ['iv','et'].forEach(rt=>{
      const inp=$('din_'+id+'_'+rt);
      if(inp&&isFinite(parseFloat(inp.value))&&parseFloat(inp.value)>0)RES[rt]=parseFloat(inp.value);
      const L=calcResus(rt);
      $('ord_'+id+'_'+rt).innerHTML=`<div class="o1">${L.t1}</div><div class="o2">${L.t2}</div>`;
      $('ckr_'+id+'_'+rt).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
      const cw=$('ckw_'+id+'_'+rt); if(cw)cw.textContent=W.toFixed(2);
    });
    return;
  }
  /* maint：h24 与 amp 两块都算，各显示各的 */
  const h24=calcH24(c), amp=calcAmp(c);
  $('ord_'+id).innerHTML=`<div class="o1">${h24.t1}</div><div class="o2">${h24.prep.join('<br>')}</div>`;
  $('ckr_'+id).innerHTML=h24.ck.map(r=>`<div class="r">${r}</div>`).join('');
  $('aord_'+id).innerHTML=`<div class="o1">${amp.t1}</div><div class="o2">${amp.prep.join('<br>')}</div>`;
  $('ackr_'+id).innerHTML=amp.ck.map(r=>`<div class="r">${r}</div>`).join('');
  document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
}
function updateAll(){CARDS.forEach(c=>updCard(c.id)); renderBasket();}

function setMode(id,m){
  S[id].mode=m;
  $('sec_h24_'+id).style.display=m==='h24'?'block':'none';
  $('sec_amp_'+id).style.display=m==='amp'?'block':'none';
  const btns=$('mt_'+id).querySelectorAll('button');
  btns.forEach(b=>b.className=b.dataset.mode===m?'on':'');
  updCard(id);
}
function toggleCap(id){
  const c=CARDS.find(x=>x.id===id); if(!c)return;
  const body=$('body_'+id), open=body.style.display==='none';
  body.style.display=open?'block':'none';
  $('tri_'+id).textContent=open?'▾':'▸';
  $('card_'+id).className='card'+(c.red?' redcard':'')+(open?' open':'');
  if(open)updCard(id);
}

/* ================= 医嘱篮 ================= */
function toggleBasket(key){
  if(basket[key])delete basket[key];
  else{
    const [cid,rt]=key.indexOf('@')>-1?key.split('@'):[key,null];
    if(rt){ if(!(RES[rt]>0))return; }
    else{
      const c=CARDS.find(x=>x.id===cid); if(!c)return;
      const el=$('din_'+cid); const v=el?parseFloat(el.value):NaN;
      if(c.kind!=='resus'&&(!isFinite(v)||v<=0))return;
    }
    basket[key]=1;
  }
  renderBasket(); renderAddBtns();
}
function delItem(k){delete basket[k]; renderBasket(); renderAddBtns();}
function renderAddBtns(){
  CARDS.forEach(c=>{
    if(c.kind==='resus'){
      ['iv','et'].forEach(rt=>{
        const b=$('add_'+c.id+'_'+rt); if(!b)return;
        const on=!!basket[c.id+'@'+rt];
        b.className='btn '+(rt==='iv'?'red':'pri')+(on?' added':'');
        b.textContent=on?'✓ 已加医嘱':(rt==='iv'?'＋ 复苏静推加医嘱':'＋ 气管内加医嘱');
      });
      return;
    }
    const b=$('add_'+c.id); if(!b)return;
    const on=!!basket[c.id];
    b.className='btn pri'+(on?' added':'');
    b.textContent=on?'✓ 已加医嘱':'＋ 加医嘱';
  });
}
function metaSummary(){
  const gaw=parseFloat(META.gaw), gad=parseFloat(META.gad)||0, dol=parseFloat(META.dol);
  const parts=[];
  if(META.bed)parts.push('床号 '+META.bed);
  if(META.name)parts.push('姓名 '+META.name);
  if(META.hosp)parts.push('住院号 '+META.hosp);
  if(isFinite(gaw)&&gaw>0)parts.push('GA '+gaw+'周+'+gad+'天');
  if(isFinite(dol)&&META.dol!=='')parts.push('日龄 '+dol+'天');
  if(isFinite(gaw)&&gaw>0&&isFinite(dol)&&META.dol!==''){const tt=gaw*7+gad+dol;parts.push('纠正胎龄 '+Math.floor(tt/7)+'周+'+(tt%7)+'天');}
  return parts;
}
function updCga(){
  const gaw=parseFloat(META.gaw), gad=parseFloat(META.gad)||0, dol=parseFloat(META.dol);
  const el=$('m_cga'); if(!el)return;
  if(isFinite(gaw)&&gaw>0&&isFinite(dol)&&META.dol!==''){
    const tot=gaw*7+gad+dol; el.textContent='CGA '+Math.floor(tot/7)+'周+'+(tot%7)+'天';
  }else el.textContent='CGA —';
}
function renderBasket(){
  const ks=Object.keys(basket);
  $('bkCnt').textContent=ks.length?`(${ks.length})`:'';
  const ms=metaSummary();
  $('ordMeta').innerHTML=(ms.length?ms.join(' · ')+' · ':'')+'体重 <b style="font-family:var(--mono)">'+W.toFixed(2)+'</b> kg · '+new Date().toLocaleDateString('zh-CN');
  $('ordList').innerHTML=ks.length?ks.map((k,i)=>{
    const L=linesOf(k);
    const ck=L.ck&&L.ck.length?`<div class="ckbox"><div class="t">核对（体重 ${W.toFixed(2)}kg）</div>${L.ck.map(r=>`<div class="r">${r}</div>`).join('')}</div>`:'';
    return `<div class="ordbox" style="position:relative"><button class="del" data-act="del" data-key="${k}">✕</button>
      <div class="o1">${i+1}. ${L.t1}</div><div class="o2">${L.prep.join('<br>')}</div></div>${ck}`;
  }).join(''):`<div style="text-align:center;color:var(--ink2);padding:22px 0;font-size:13px">（空）—— 展开药物输剂量后点【＋加医嘱】</div>`;
  $('ordTxt').value=`【新生儿临时医嘱】${ms.length?ms.join(' '):'体重'+W.toFixed(2)+'kg'} ${new Date().toLocaleDateString('zh-CN')}\n`+
    ks.map(k=>{const L=linesOf(k); return [L.t1].concat(L.prep||[]).join('\n');}).join('\n')+'\n（须上级医师核对后录入）';
}

/* ================= 长图（780px 黑白简框） ================= */
function makeImg(){
  const ks=Object.keys(basket), Wc=780, pad=44, innerW=Wc-2*pad-24;
  const ms=metaSummary();
  const strip=s=>s.replace(/<[^>]+>/g,'');
  const items=ks.map(k=>({k,L:linesOf(k)}));
  function render(H){
    const cv=document.createElement('canvas'); cv.width=Wc; cv.height=H;
    const x=cv.getContext('2d');
    function wrap(txt,xx,yy,maxw,lh,font){x.font=font;var lt='';for(var i=0;i<txt.length;i++){var t2=lt+txt[i];if(x.measureText(t2).width>maxw){x.fillText(lt,xx,yy);lt=txt[i];yy+=lh;}else lt=t2;}if(lt)x.fillText(lt,xx,yy);return yy+lh;}
    x.fillStyle='#fff'; x.fillRect(0,0,Wc,H);
    x.strokeStyle='#000'; x.lineWidth=3; x.strokeRect(14,14,Wc-28,H-28);
    x.fillStyle='#000'; x.font='bold 30px sans-serif'; x.fillText('临时医嘱（药物计算）',pad,64);
    x.font='20px sans-serif'; x.fillText(new Date().toLocaleDateString('zh-CN'),Wc-pad-150,62);
    x.font='16px sans-serif'; x.fillText('体重 '+W.toFixed(2)+'kg'+(ms.length?' · '+ms.join('  '):''),pad,90);
    x.strokeStyle='#000'; x.lineWidth=1; x.beginPath(); x.moveTo(pad,102); x.lineTo(Wc-pad,102); x.stroke();
    var yy=120;
    if(!items.length){x.fillStyle='#666';x.font='22px sans-serif';x.fillText('（未选药物）',pad,yy);yy+=40;}
    items.forEach((it,i)=>{
      var boxTop=yy;
      x.fillStyle='#000'; x.font='bold 20px monospace';
      var yc=wrap((i+1)+'. '+it.L.t1,pad+12,boxTop+28,innerW,28,'bold 20px monospace');
      if(it.L.prep){x.fillStyle='#333';it.L.prep.forEach(pl=>{yc=wrap(pl,pad+12,yc+2,innerW,24,'16px monospace');});}
      var bh=yc-boxTop+10;
      x.strokeStyle='#000';x.lineWidth=1.5;x.strokeRect(pad,boxTop,Wc-2*pad,bh);
      yy=boxTop+bh+8;
      if(it.L.ck&&it.L.ck.length){
        var ckTop=yy;
        x.fillStyle='#555';x.font='bold 13px sans-serif';x.fillText('核对（体重 '+W.toFixed(2)+' kg）',pad+12,ckTop+16);
        yc=ckTop+36;
        it.L.ck.forEach(r=>{x.fillStyle='#222';x.font='14px monospace';yc=wrap(strip(r),pad+12,yc,innerW,22,'14px monospace');});
        var ch=yc-ckTop+8;
        x.strokeStyle='#888';x.lineWidth=1;x.setLineDash([5,4]);x.strokeRect(pad,ckTop,Wc-2*pad,ch);x.setLineDash([]);
        yy=ckTop+ch+10;
      }
    });
    return {cv,yyEnd:yy};
  }
  const p1=render(3000);
  const H=Math.max(600,p1.yyEnd+60);
  const cv=render(H).cv;
  const x=cv.getContext('2d');
  x.fillStyle='#555';x.font='13px sans-serif';
  x.fillText('生成于 '+new Date().toLocaleString('zh-CN')+' · 上框=医嘱+24小时量 下框=核对 · 须上级医师核对后录入HIS',pad,H-30);
  $('imgPrev').src=cv.toDataURL('image/png'); $('imgPrev').style.display='block';
  cv.toBlob(function(blob){
    if(!blob)return;
    var file=null; try{file=new File([blob],'医嘱_'+W.toFixed(2)+'kg.png',{type:'image/png'});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'医嘱'}).catch(function(){});return;}
    var a=document.createElement('a'); a.download='医嘱_'+W.toFixed(2)+'kg.png'; a.href=URL.createObjectURL(blob);
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
  },'image/png');
}
function copyOrder(){
  const t=$('ordTxt').value;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(
    ()=>$('copied').textContent='✓ 已复制',
    ()=>{const ta=$('ordTxt'); ta.select(); document.execCommand('copy'); $('copied').textContent='✓ 已复制';});
  setTimeout(()=>$('copied').textContent='',2500);
}
function go(n){
  $('nav0').className=n===0?'on':'';
  $('nav1').className=n===1?'on':'';
  $('p0').className='page'+(n===0?' on':'');
  $('p1').className='page'+(n===1?' on':'');
  window.scrollTo(0,0);
}

/* ================= 事件委托（document 级，无逐元素监听） ================= */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='wt'){
    const v=parseFloat(t.value); if(!isFinite(v))return;
    W=Math.min(6,Math.max(0.4,v));
    if(W!==v)$('wt').value=String(W);
    $('wtNow').textContent='按 '+W.toFixed(2)+'kg 计算';
    try{localStorage.setItem('vasoW',String(W));}catch(err){}
    updateAll(); return;
  }
  if(t.dataset.meta!==undefined&&t.dataset.meta!==''){
    const k=t.dataset.meta; META[k]=t.value;
    try{localStorage.setItem('vasoMeta',JSON.stringify(META));}catch(err){}
    updCga(); renderBasket(); return;
  }
  const a=t.dataset.act;
  if(a==='dose'||a==='rate'||a==='amprate'){updCard(t.dataset.card);}
  else if(a==='resus'){updCard('epi_resus');}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  switch(b.dataset.act){
    case 'cap': toggleCap(b.dataset.card); break;
    case 'mode': setMode(b.dataset.card,b.dataset.mode); break;
    case 'add': toggleBasket(b.dataset.key); break;
    case 'del': delItem(b.dataset.key); break;
    case 'go': go(parseInt(b.dataset.page,10)); break;
    case 'copy': copyOrder(); break;
    case 'img': makeImg(); break;
    case 'print': window.print(); break;
  }
});

/* ================= 启动 ================= */
(function init(){
  let sv=NaN;
  try{sv=parseFloat(localStorage.getItem('vasoW'));}catch(e){}
  if(isFinite(sv))$('wt').value=sv;
  const wv=parseFloat($('wt').value); if(isFinite(wv))W=Math.min(6,Math.max(0.4,wv));
  $('wtNow').textContent='按 '+W.toFixed(2)+'kg 计算';
  try{
    const m=JSON.parse(localStorage.getItem('vasoMeta')||'{}');
    Object.keys(META).forEach(k=>{if(m[k])META[k]=m[k];});
  }catch(e){}
  document.querySelectorAll('[data-meta]').forEach(el=>{el.value=META[el.dataset.meta]||'';});
  renderCards();
  updCga();
  updateAll();
})();
</script>
</body>
</html>
