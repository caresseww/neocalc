<style>

}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--paper); color:var(--ink);

.wrap{max-width:640px; margin:0 auto; padding:0 12px 96px;}

header{position:sticky; top:0; z-index:50; background:linear-gradient(165deg,#0a1e3c 0%,#163b70 55%,#2a62a8 100%); color:#fff;

  pointer-events:none;}
header .t0{font-size:16px; font-weight:700; letter-spacing:1px;

  filter:drop-shadow(0 1px 4px rgba(4,16,34,.45));}
header .t0::before{content:''; display:block; width:28px; height:2px; border-radius:2px; margin-bottom:4px;
  background:linear-gradient(90deg,#f5b544,#fde3b0);}
.brandrow{display:flex; align-items:center; gap:7px; margin-top:3px;}

.wtrow{display:flex; align-items:center; gap:10px; margin-top:8px; padding-top:8px;

.wtrow label{font-size:13.5px; font-weight:700; white-space:nowrap;}
.wtrow .brand, .wtrow .t2{white-space:nowrap; flex:0 0 auto;}

#wt{width:88px; font-size:19px; font-weight:600; text-align:center; border:none; border-radius:9px;

.wtrow .unit{font-size:13.5px; opacity:.9;}
.wtnow{font-size:12px; background:rgba(255,255,255,.16); border-radius:8px; padding:3px 9px;}

nav button.on{background:#fff; border-color:#fff; color:var(--navy); box-shadow:0 1px 5px rgba(4,16,34,.3);}
.page{display:none;} .page.on{display:block;}
.searchrow{padding:9px 0 11px;}
.searchrow input{width:100%; border:none; border-radius:12px; background:rgba(255,255,255,.94);

.searchrow input:focus{outline:none; background:#fff;}

.abinfo{background:#f0f0f0; color:var(--ink); padding:7px 10px; border-radius:8px; margin:5px 0; font-size:12.5px; line-height:1.55;}
.abinfo .abt{font-weight:700; color:var(--ink); margin-bottom:2px;}
.abinfo.warnb{background:#f0f0f0;}
.abinfo.warnb .abt{color:var(--ink);}
.abinfo.badb{background:#f0f0f0;}
.abinfo.badb .abt{color:var(--ink);}
.dualwrap{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0;}
.dualmod{border:1px solid #e3eaf5; border-radius:12px; padding:8px; background:#fafcff;}
.dualt{font-size:12px; font-weight:700; color:var(--navy2); margin-bottom:4px;}
.dualord .o1{font-size:12px;}
.dualck{font-size:11px; color:#5b6b85; margin-top:4px; line-height:1.5;}
.group{background:var(--card); border:none; border-radius:18px; margin:10px 0;
  box-shadow:0 4px 16px rgba(15,35,70,.07); overflow:hidden; cursor:pointer;}
.group:active{background:#f4f7fc;}
.backrow{display:flex; align-items:center; gap:4px; padding:9px 4px 7px; color:var(--navy2);

.ghead{display:flex; align-items:center; gap:10px; padding:11px 14px; min-height:42px; cursor:pointer; user-select:none;}
.ghead:active{background:#eef3fb;}
.gtri{color:var(--navy2); font-size:13px; width:13px; flex:0 0 auto;}
.gtitle2{font-size:14px; font-weight:600;}
.gico{font-size:19px; flex:0 0 auto;}
.gsub{font-size:10.5px; color:var(--ink2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.gmain{min-width:0; flex:1;}
.gcnt{margin-left:auto; font-family:var(--mono); font-size:12px; color:#fff; background:var(--navy2);  border-radius:12px; padding:2px 9px; font-weight:600; flex:0 0 auto;}
[id^="lbody_"] .card{margin:9px 0;}
.group.open .ghead{border-bottom:1px dashed var(--line);}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; margin:12px 0;

.chead:active{background:#eef3fb;}
.card{scroll-margin-top:150px;}
.chead .csum{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--navy2); font-weight:700;
  text-align:right; white-space:nowrap;}
.card.open .csum{display:none;}
.card:not(.open) .cspec{display:none;}
.chead .tri{color:var(--navy2); font-size:13px; width:13px; flex:0 0 auto;}
.chead .ct{font-size:15px; font-weight:600;}
.chead .en{font-size:12px; color:var(--ink2); font-weight:400;}
.chead .cspec{margin-left:auto; font-size:11.5px; color:var(--ink2); font-family:var(--mono); text-align:right;}
.card.open{border-color:#c9d4e8;}
.card.open .chead{border-bottom:1px dashed var(--line);}
.cbody{padding:0 14px 12px;}
.redcard{border:1.5px solid var(--red); background:#fffbfb;}
.redcard .chead .ct{color:var(--red);} .redcard .chead .tri{color:var(--red);}
.spec{font-size:12px; color:var(--ink2); margin-top:2px;}
.spec b{color:var(--ink);}
.redsec{border:1px solid #ecc8c8; background:#fdf6f6; border-radius:11px; padding:8px 10px; margin-top:8px;}
.redsec_t{font-size:13px; font-weight:600; color:var(--red); margin-bottom:4px;}
.labeq{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 5px; font-size:13.5px; font-weight:700; white-space:nowrap;}
.stepwrap{display:inline-flex; align-items:center; gap:5px;}
.stp{width:34px; height:34px; border:1.5px solid var(--line); background:#fff; color:var(--navy2);
  border-radius:9px; font-size:17px; font-weight:600; line-height:1; cursor:pointer; padding:0; flex:0 0 auto;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;}
.stp:active{background:var(--navybg);}
.stepwrap input{width:64px;}
.labeq input{width:74px; font-size:16px; font-weight:600; text-align:center; font-family:var(--mono);
  border:1.5px solid var(--line); border-radius:9px; padding:4px 6px; background:#fff; color:var(--ink);}
.labeq input:focus{outline:none; border-color:var(--navy2);}
.modetabs{display:flex; margin-top:10px; border:1.5px solid var(--navy2); border-radius:13px; overflow:hidden;
  box-shadow:0 1px 5px rgba(15,35,70,.08);}
.modetabs.formtabs{border:none; gap:8px; margin-top:12px; background:none;}
.modetabs.formtabs button{border:1.5px solid #d9c48a; background:#fffdf6; color:#8a6a1d;
  border-radius:12px; padding:10px 0; font-size:14px; font-weight:600;}
.modetabs.formtabs button.on{background:#b98a2d; border-color:#b98a2d; color:#fff;
  box-shadow:0 1px 4px rgba(120,90,20,.3);}
.modetabs button{flex:1; border:none; background:#fff; color:var(--navy2); padding:9px 0; font-size:13.5px; font-weight:600; cursor:pointer;
  border-right:1px solid rgba(43,92,173,.25);}
.modetabs button:last-child{border-right:none;}
.modetabs button.on{background:var(--navy2); color:#fff; font-weight:700;}
.ordbox{border:none; border-radius:16px; padding:12px 14px; margin-top:10px;
  background:var(--navybg);
  box-shadow:0 2px 8px rgba(15,35,70,.06);}
.ordbox .o1{font-family:var(--mono); font-size:13px; font-weight:700; word-break:break-all; line-height:1.5; color:var(--ink);}
.ordbox .o2{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--ink); margin-top:5px; word-break:break-all;
  border-top:1px dashed #b9c9e2; padding-top:5px; line-height:1.5;}
.ckbox{border:none; border-radius:14px; padding:9px 12px; margin-top:8px; background:#f4f5f7;
  font-size:11.5px; color:#333;}
.ckbox .t{font-size:11px; font-weight:600; color:var(--ink2); letter-spacing:1px; margin-bottom:3px;}
.ckbox .r{font-family:var(--mono); font-size:11.5px; margin-top:2px; word-break:break-all; line-height:1.4;}
.ckbox .r b{color:var(--navy); font-weight:600;}
.dosebox{background:#fff; border:none; box-shadow:0 1px 6px rgba(15,35,70,.05);}
.dosebox .t{color:var(--navy2);}
.dosebox .r b{color:var(--navy2);}
.btnrow{display:flex; gap:9px; margin-top:9px; align-items:center; flex-wrap:wrap;}
.btn{border:none; border-radius:11px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer;}
.btn.pri{background:var(--navy); color:#fff;}
.btn.pri:active{background:var(--navy2);}
.btn.red{background:var(--red); color:#fff;}
.btn.added{background:#0c7a4d;}
.note{font-size:11.5px; color:var(--ink2); margin-top:5px;}
details.more{margin-top:9px; border-top:1px dashed var(--line); padding-top:6px;}
details.more summary{font-size:12.5px; color:var(--ink2); font-weight:700; cursor:pointer;}
.mrow{font-size:12.3px; line-height:1.55; margin-top:6px; padding-left:9px; border-left:3px solid var(--line);}
.mrow b{color:var(--ink);}
.mrow.warn{border-left-color:var(--red); background:var(--redbg); border-radius:0 8px 8px 0; padding:6px 9px;}
.mrow.cmp{border-left-color:var(--navy2); background:var(--navybg); border-radius:0 8px 8px 0; padding:6px 9px;}
.copied{font-size:12.5px; color:#0c7a4d; font-weight:600;}
.metarow{display:flex; gap:18px; row-gap:10px; flex-wrap:wrap; align-items:center; background:#fff; border:1px solid var(--line);
  border-radius:11px; padding:11px 13px; margin-top:10px; font-size:13px; color:var(--ink2);}
.metarow label{display:flex; align-items:center; gap:5px; font-weight:700; white-space:nowrap;}
.metarow input{border:1px solid var(--line); border-radius:8px; padding:5px 9px; font-size:14px; width:72px;

.metarow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.metarow input[type=number]{-moz-appearance:textfield; appearance:textfield;}
.metarow .cgachip{background:var(--navybg); border:1px solid #9db4d8; color:var(--navy2); border-radius:8px;

.ord-head{text-align:center; margin-top:10px;}
.ord-head .h1{font-size:19px; font-weight:700; letter-spacing:4px;}
.ord-head .h2{font-size:11.5px; color:var(--ink2); margin-top:2px;}
textarea#ordTxt{width:100%; height:150px; font-family:var(--mono); font-size:12px; border:1px solid var(--line);
  border-radius:10px; padding:8px; background:#fff;}
#imgPrev{width:100%; border:1px solid var(--line); border-radius:10px; margin-top:6px;}
details.ref{margin-top:8px;} details.ref summary{font-size:13px; font-weight:700; color:var(--ink2);}
.ref-body{border:1px solid var(--line); border-radius:10px; padding:8px; margin-top:6px; background:#fff;}
.del{position:absolute; top:6px; right:8px; border:none; background:none; color:var(--red);
  font-size:15px; font-weight:700; padding:2px 4px; cursor:pointer;}
.ordops{margin-top:6px;}
@media(max-width:430px){
  .chead .en{display:none;}
  .chead .csum{font-size:10.5px;}
}
@media print{
  header,nav,.btnrow,details,#p0,#p1,#pS,.searchrow,#cartbar,.copied,.del{display:none !important;}
  .page{display:block !important;}
  .ordbox{background:#fff !important; border-color:#000 !important; box-shadow:none !important;}
  .ordbox .o1,.ordbox .o2{color:#000 !important;}
  .ordbox .o2{border-top-color:#999 !important;}
}
</style>

<body>
<header>
  <div class="t0">新生儿药物计算器</div>

    <label>体重</label>

    <span class="wtnow" id="wtNow"></span>
    <span class="brand" style="margin-left:auto">NeoAI</span><span class="t2">To make your life easier</span>
  </div>
  <div class="searchrow" id="searchrow">
    <input id="q" type="search" inputmode="search" placeholder="搜药名：多巴胺 / 芬太尼 / 力月西…" autocomplete="off">
  </div>
</header>

<div class="wrap">
<div class="page on" id="pMain">
  <div id="viewL1"></div>
  <div id="viewL2" style="display:none"></div>
  <div id="viewL3" style="display:none"></div>
</div>
<div class="page" id="pS">
  <div id="holderS"></div>
  <div id="sEmpty" style="display:none;text-align:center;color:var(--ink2);padding:26px 0;font-size:13px">无匹配药物</div>
</div>

  <div class="ord-head">

  <div id="ordList"></div>
  <div class="btnrow">

</div>
<div id="cartbar">

  <button class="cbtn" data-act="go" data-page="2">查看医嘱单 ›</button>
</div>

/* ================= CALC：纯函数，唯一真源 ================= */
function f(x,n=2){let s=Number(x).toFixed(n); if(s.indexOf('.')>-1)s=s.replace(/0+$/,'').replace(/\.$/,''); return s;}
function f2(x){return f(x,2);}
function isPerMin(g){return g.unit.indexOf('min')>-1;}
function niceRate(x){if(!(x>0))return 0.05; let n=Math.round(x*20)/20; if(n<x&&(x-n)/x>0.05)n=(Math.round(n*20)+1)/20; return Math.max(0.05,n);}
function rateOf(dose,g){return g.dynamic?1:(g.rateW?dose*W*g.rateW:dose/g.rateDiv);}
function amt(mg){return mg>=0.1? f(mg,2)+'mg' : f(mg*1000,1)+'μg';}
function unitTail(g){return g.unit==='μg/kg/h'?'hr':'min';}

/* 维持·按24小时配（特利=12h袋） */
function calcH24(id){

    const bagMg=0.12*W;   /* 本院口径：0.12mg/kg→12ml（浓度10μg/kg/ml），液速数值=剂量数值 */
    const rEl=parseFloat($('rin_'+id).value);
    const R=(isFinite(rEl)&&rEl>0)?rEl:niceRate(dose/10);
    return {t1:`特利加压素${f2(R)}ml/h=${f(dose,2)}ug/kg/hr，维持12小时`,
      prep:[`特利加压素 ${f(bagMg,2)}mg`, `0.9%氯化钠 至 12ml`],
      ck:[`剂量核对：${f(dose,2)} μg/kg/h×${W.toFixed(2)}kg×12h＝<b>${f(dose*W*12/1000,2)}mg</b>（12h袋）`,
          `液体核对：泵速<b>${f2(R)}ml/h</b>；12小时入液<b>${f2(R*12)}ml</b>`], R, dose};

/* 维持·按整支配（固定整支药量，泵速→稀释体积反算） */
function calcAmp(id){
  if(id==='insulin')return calcInsulinAmp(id);
  const g=DRUGS[id], pm=isPerMin(g);
  const isPerDay=g.unit.indexOf('kg/d')>-1;
  const isNg=g.unit.indexOf('ng')>-1;
  const dinEl=$('din_'+id);
  const dEl=dinEl?parseFloat(dinEl.value):NaN;
  const doseRaw=(isFinite(dEl)&&dEl>0)?dEl:g.def;
  const dose=isNg?doseRaw/1000:doseRaw;  /* 统一到μg域 */
  const rEl=parseFloat($('arin_'+id).value);
  const R=(isFinite(rEl)&&rEl>0)?rEl:niceRate(rateOf(doseRaw,g));  /* 建议值用原始单位剂量 */
  const M=g.specMg;
  const Cneed=isPerDay?dose*W/(24*R):dose*W*(pm?60:1)/(R*1000);          /* mg/ml */
  let V=M/Cneed; V=Math.max(2,Math.ceil(V*2-1e-9)/2);  /* 0.5ml取整，宁多勿少 */
  const stockMl=M/g.stockConc;
  const water=Math.max(0,V-stockMl);
  const C1=M/V;
  const actUg=isPerDay?R*C1*24/W:R*C1*1000/(W*(pm?60:1));
  const act=isNg?actUg*1000:actUg;  /* 换回显示单位 */
  const dur=V/R;
  const t1=`${g.name}${f2(R)}ml/h=${f(act,2)}${g.unit}`;
  const drugLine = id==='ne'
    ? `重酒石酸去甲肾上腺素 ${f(M*2,2)}mg（去甲肾${f(M,2)}mg，原液1ml）`
    : `${g.name} ${f(M,2)}mg`;
  return {t1,
    prep:[drugLine,`${g.diluent||'0.9%氯化钠或5%葡萄糖'} ${f(water,1)}ml → 共 ${f(V,1)}ml`],
    ck:[`1支药物可维持时间：${f(g.specMg,2)}mg ÷ (${W.toFixed(2)}kg×${f(act,2)} ${g.unit}${pm?'×60min':isPerDay?'×24h':''})＝<b>${f(dur,1)}h</b>`,
        `液体核对：泵速${f2(R)}ml/h×${f(dur,1)}h＝<b>${f(V,1)}ml</b>`], R, dose};
}

function calcQd(id){
  const g=DRUGS[id], cfg=QDCFG[id];
  let dv=cfg.def, fq=cfg.freq||'qd';
  if(cfg.modes){const mm=cfg.modes.find(m=>m.k===(QMODE[id]||cfg.modes[0].k)); if(mm){dv=mm.def!==undefined?mm.def:cfg.def; fq=mm.freq||fq;}}
  const selEl=$('selq_'+id);
  if(cfg.freqOptions&&selEl&&selEl.value){fq=selEl.value;}
  const dEl=parseFloat($('dinq_'+id).value), dose=(isFinite(dEl)&&dEl>0)?dEl:dv;
    const a=cfg.abs?dose:dose*W;               /* abs=true＝绝对量滴定（左甲状腺素μg/熊去氧mg/西甲硅油ml/普萘洛尔mg/地高辛μg） */
    const rt=cfg.route?` ${cfg.route}`:'';
    if(cfg.dailyDiv){
      /* 按日剂量分次（普萘洛尔血管瘤流程：输入mg/kg/d，输出q12h单次mg；档位=流程日/减量周） */
      const mm=(cfg.modes||[]).find(m=>m.k===(QMODE[id]||''));
      const per=dose*W/cfg.dailyDiv;
      return {t1:`${g.name} ${f(per,2)}mg${rt} ${fq}（${f(dose,2)}mg/kg/d 分${cfg.dailyDiv}次）`,
        prep:[],
        ck:[mm?`方案：${mm.label}（科室血管瘤流程档位，可切换）`:'方案：自定义剂量',
            `剂量核对：${f(dose,2)}mg/kg/d × ${W.toFixed(2)}kg ＝ ${f(dose*W,2)}mg/d ÷ ${cfg.dailyDiv} ＝ <b>${f(per,2)}mg/次</b>`], dose};
    }
  if(cfg.formTgl){
    /* 地高辛剂型切换（10-14用户两轮：按体重算+医嘱能照抄执行——溶液给毫升/片剂给毫克）：
       输入 μg/kg/d → 日量=×W → q12h 单次=÷2 → 溶液 ml=÷50 / 片剂 mg=÷1000 */
    const daily=dose*W, per=daily/2;
    const ckDose=[`剂量核对：${f(dose,2)}μg/kg/d × ${W.toFixed(2)}kg ＝ ${f(daily,1)}μg/d ÷ 2 ＝ <b>${f(per,1)}μg/次</b>（范围5–10μg/kg/d，按血药浓度与心率滴定）`];
    if((QFORM[id]||'sol')==='tab'){
      const mg=per/1000, pcs=mg/cfg.tabMgPerTab;
      return {t1:`${cfg.tabName} ${f(mg,3)}mg（${f(per,1)}μg＝${f(pcs,2)}片，研配按量给）${rt} ${fq}`,
        prep:[], ck:[...ckDose, `换算核对：${f(per,1)}μg＝${f(mg,3)}mg＝${f(pcs,2)}片（0.25mg/片；库内片剂写法 0.003–0.01mg q12h）`], dose};
    }
    const ml=per/50;
    return {t1:`${cfg.solName} ${f(ml,2)}ml（${f(per,1)}μg）${rt} ${fq}`,
      prep:[], ck:[...ckDose, `换算核对：${f(per,1)}μg ÷ 50μg/ml ＝ ${f(ml,2)}ml（0.005%溶液；库内 0.05–0.2ml＝2.5–10μg/次，样例「0700=0.2ml」）`], dose};
  }
  if(cfg.perMl){
    const R=a*(cfg.perMl+cfg.gsPerMg);
    return {t1:`${g.name} ${f2(a)}${cfg.out} 滴速${f2(R)}ml/h ${cfg.freq||'qd'}`,
      prep:[`${g.name} ${f2(a)}mg（原液 ${f2(a*cfg.perMl,2)}ml）`, `5%葡萄糖 至 ${f2(R,1)}ml`],
      ck:[`剂量核对：${f(dose,2)}${cfg.unit}×${W.toFixed(2)}kg＝<b>${f2(a)}${cfg.out}</b>`], dose};
  }
  if(cfg.mlConc){
    const ml=a/cfg.mlConc;
    return {t1:`${g.name} ${f2(ml)}ml（${f2(a)}${cfg.out}，${f2(dose,2)}${cfg.unit}）${rt} ${fq}`,
      prep:[],
      ck:[`剂量核对：${f2(dose,2)}${cfg.unit}${cfg.abs?'':'×'+W.toFixed(2)+'kg'}＝<b>${f2(a)}${cfg.out}</b>＝${f2(ml)}ml（${cfg.mlConc}mg/ml）`], dose};
  }
  return {t1:`${g.name} ${f2(a)}${cfg.out}${rt} ${fq}`,
    prep:[],
    ck:[`剂量核对：${f2(dose,2)}${cfg.unit}${cfg.abs?'':'×'+W.toFixed(2)+'kg'}＝<b>${f2(a)}${cfg.out}</b>`], dose};
}
/* 胺碘酮/心律平双模块（10-14用户定稿）：负荷左/维持右，配比相同自动copy同一管；库内=负荷干包+维持独立泵速两条医嘱分开写，每日弃余重配 */
function calcPump(id){
  const g=DRUGS[id];
  const dlEl=parseFloat($('din_'+id).value);
  const dl=(isFinite(dlEl)&&dlEl>0)?dlEl:5;   /* 负荷 mg/kg */
  const dmEl=$('dinm_'+id);
  const dmV=parseFloat(dmEl.value);
  const dm=(isFinite(dmV)&&dmV>0)?dmV:g.def;  /* 维持 μg/kg/min */
  const mg=dl*W, stock=mg*g.stockMlPerMg, gs=12, V=stock+gs;   /* 库内铁律：负荷干包固定伴5%葡萄糖12ml（24mg/60mg/19mg均12ml） */
  const R=dm/g.rateDiv;                        /* 维持独立组液：库内标化 1ml/h=10(胺碘酮)/8(心律平)μg/kg/min */
  const mg24=dm*W*1.44;                        /* 维持24小时药量 */
  const t1=`${g.name} ${f2(mg)}mg 滴速${f2(V)}ml/h 静推 once`;
  return {t1,
    prep:[`${g.name} ${f2(mg)}mg（原液 ${f2(stock,2)}ml）`,
      `5%葡萄糖 12ml`,
      `${g.name}${f2(R)}ml/h=${f2(dm,2)}μg/kg/min，维持24小时`,
      `${g.name} ${amt(mg24)}/24h`,
      `${g.diluent||'0.9%氯化钠或5%葡萄糖'} ${f2(R*24)}ml/24h`],
    ck:[`负荷核对：滴速${f2(V)}ml/h×1小时＝<b>${f2(mg)}mg</b>（${f2(dl,1)}mg/kg）——干包单独一条`,
        `维持核对：独立组液泵速<b>${f2(R)}ml/h</b>＝${f2(dm,2)}μg/kg/min（${amt(mg24)}/24h）——两条医嘱分开写`], dose:dm,
    load:{t1:`① 负荷　${g.name} ${f2(mg)}mg 滴速${f2(V)}ml/h 静推 once`,
      ck:`配液：原液 ${f2(stock,2)}ml ＋ 5%葡萄糖 12ml（库内固定）＝ ${f2(V,1)}ml，滴速＝总体积÷1小时`},
    maint:{t1:`② 维持　${g.name}${f2(R)}ml/h=${f2(dm,2)}μg/kg/min，维持24小时`,
      ck:`独立组液：${amt(mg24)}/24h ＋ 溶媒 ${f2(R*24)}ml/24h——库内负荷干包与维持是两条医嘱、两套液体`}};
}
/* 胰岛素（库内口径：0.1ml/h=0.01iu/kg/h；配比铁律 1iu胰岛素:4g糖，4小时弃液重配；停胰岛素连葡萄糖组同停） */
function calcInsulinH24(id){
  const g=DRUGS[id];
  const dinEl=$('din_'+id);
  const dEl=dinEl?parseFloat(dinEl.value):NaN;
  const dose=(isFinite(dEl)&&dEl>0)?dEl:g.def;  /* iu/kg/h */
  const rEl=parseFloat($('rin_'+id).value);
  const R=(isFinite(rEl)&&rEl>0)?rEl:dose*10, iuH=dose*W;
  return {t1:`胰岛素${f2(R)}ml/h=${f2(dose,2)}iu/kg/h，维持24小时`,
    prep:[`胰岛素 ${f2(iuH*24,2)}iu/24h`, `10%葡萄糖 ${f2(iuH*960,1)}ml/24h`],
    ck:[`剂量核对：${f2(dose,2)} iu/kg/h×${W.toFixed(2)}kg＝<b>${f2(iuH)}iu/h</b>`,
        `液体核对：泵速<b>${f2(R)}ml/h</b>（0.1ml/h=0.01iu/kg/h）`], R, dose};
}
function calcInsulinAmp(id){
  const g=DRUGS[id];
  const dinEl=$('din_'+id);
  const dEl=dinEl?parseFloat(dinEl.value):NaN;
  const dose=(isFinite(dEl)&&dEl>0)?dEl:g.def;  /* iu/kg/h */
  const rEl=parseFloat($('arin_'+id).value);
  const R=(isFinite(rEl)&&rEl>0)?rEl:dose*W*4, act=R*0.25/W;  /* 组液 1iu＋10%葡萄糖 40ml（1iu:4g糖） */
  return {t1:`胰岛素${f2(R)}ml/h=${f2(act,2)}iu/kg/h，维持4小时`,
    prep:[`胰岛素 1iu`, `10%葡萄糖 40ml/4h`],
    ck:[`剂量核对：泵速${f2(R)}ml/h×0.25iu/ml÷${W.toFixed(2)}kg＝<b>${f2(act,2)}iu/kg/h</b>`,
        `液体核对：泵速<b>${f2(R)}ml/h</b>；4小时入液<b>${f2(R*4)}ml</b>`], R, dose:act};
}

/* 静推/首剂（剂量框 dinp_ 与维持分开） */
function calcPush(id){
  const g=DRUGS[id], cfg=PUSHCFG[id];
  const dEl=parseFloat($('dinp_'+id).value), dose=(isFinite(dEl)&&dEl>0)?dEl:cfg.def;
  const a=cfg.abs?dose:dose*W;   /* abs=true＝绝对剂量（如巴曲亭 iu），不乘体重 */
  if(cfg.pumpLoad){
    const V=a*g.stockMlPerMg+12;   /* 库内干包：5%葡萄糖固定12ml */
    return {t1:`${g.name} ${f2(a)}mg 滴速${f2(V)}ml/h 静推 once`,
      prep:[`${g.name} ${f2(a)}mg（原液 ${f2(a*g.stockMlPerMg,2)}ml）`, `5%葡萄糖 12ml`],
      ck:[`负荷核对：滴速${f2(V)}ml/h×1小时＝<b>${f2(a)}mg</b>（${f2(dose,1)}mg/kg；库内固定12ml糖水，次日弃余重配）`], dose};
  }
  if(cfg.perMl){
    const R=a*(cfg.perMl+cfg.gsPerMg);
    return {t1:`${g.name} ${f2(a)}${cfg.out} 滴速${f2(R)}ml/h${cfg.freq?' '+cfg.freq:''}`,
      prep:[`${g.name} ${f2(a)}mg（原液 ${f2(a*cfg.perMl,2)}ml）`, `5%葡萄糖 至 ${f2(R,1)}ml`],
      ck:[`剂量核对：${f(dose,2)}${cfg.unit}×${W.toFixed(2)}kg＝<b>${f2(a)}${cfg.out}</b>`], dose};
  }
  const rt=(cfg.route&&cfg.route!=='静推')?' '+cfg.route:'';
  let prep=cfg.dilPerMg?[`${cfg.diluent||'5%葡萄糖'} ${f(a*cfg.dilPerMg,1)}ml`]:[];
  let dilCk=[];
  if(cfg.dil){
    /* 静滴推注药的配液行（止血敏）：体积=剂量÷库内浓度，软上限加浓——与抗感染配液体系同构 */
    const ivd=abIv(a,{lc:cfg.dil.lc,cap:cfg.dil.cap});
    prep=[...prep, `${cfg.dil.base} ${f(ivd.V,1)}ml`];
    dilCk=[`配液核对：${f2(a)}mg ÷ ${f(ivd.V,1)}ml ＝ ${f(a/ivd.V,1)}mg/ml（${cfg.dil.src}）`];
    if(ivd.why)dilCk.push(`⚠ ${ivd.why}`);
  }
  if(cfg.abs){
    const m=PRMODE[id]||'iv', half=a/2;
    const L={iv:  {t1:`${g.name} ${f2(a)}${cfg.out} st`},
      iv_et:{t1:`${g.name} ${f2(half)}${cfg.out} 静推 st`, prep:[`${g.name} ${f2(half)}${cfg.out} 气管插管内滴入 st`]},
      iv_gt:{t1:`${g.name} ${f2(half)}${cfg.out} 静推 st`, prep:[`${g.name} ${f2(half)}${cfg.out} 胃管内注入 st`]},
      et:   {t1:`${g.name} ${f2(a)}${cfg.out} 气管插管内滴入 st`},
      gt:   {t1:`${g.name} ${f2(a)}${cfg.out} 胃管内注入 st`}}[m]||{t1:`${g.name} ${f2(a)}${cfg.out} st`};
    return {t1:L.t1, prep:[...(cfg.dissolve?[cfg.dissolve]:[]), ...(L.prep||[])],
      ck:[`剂量核对：绝对剂量 <b>${f2(a)}${cfg.out}</b>（库内 0.25–1iu；组合用法＝静推＋局部各半）`], dose};
  }
  const ck=`剂量核对：${f(dose,2)}${cfg.unit}×${W.toFixed(2)}kg＝<b>${f2(a)}${cfg.out}</b>`;
  return {t1:`${g.name} ${f2(a)}${cfg.out}${rt} ${cfg.freq||'st'}`,
    prep,
    ck:[ck,...dilCk], dose};
}
/* 抗感染：按 剂量档×日龄/胎龄/PMA 自动推荐 scheme；IV 附溶媒行 */
/* IV配液体积（10-14用户两轮定稿）：推荐体积=药量÷库内浓度lc；库内体积上限cap=软上限（超了加浓，浓度仍在说明书内）；
   说明书浓度区间=硬红线（最高浓度→体积硬下限Vlo不可压；最低浓度→体积硬上限Vhi不可超）；医生可在「配液量」框自选 */
function abIv(a,ivc){
  const cu=ivc.cu||'mg/ml';
  const cap=ivc.cap||15;
  const VmaxConc=ivc.max?a/ivc.max:0;   /* 说明书最高浓度→体积硬下限 */
  const VminConc=ivc.min?a/ivc.min:0;   /* 说明书最低浓度→体积硬上限 */
  const Vlo=Math.max(2, VmaxConc), Vhi=VminConc||Infinity;
  let V=Math.max(Math.round(a/ivc.lc*2)/2,0.5), why='';
  if(V<Vlo){V=Math.ceil(Vlo*2)/2; why=`已达说明书最高浓度${ivc.max}${cu}——体积最小须配至${f(V,1)}ml`;}
  else if(V>Vhi){V=Math.floor(Vhi*2)/2; why=`已达说明书最低浓度${ivc.min}${cu}——最多稀释至${f(V,1)}ml`;}
  else if(V>cap){
    if(Vlo>cap){V=Math.ceil(Vlo*2)/2; why=`说明书最高浓度${ivc.max}${cu}——本剂至少须配至${f(V,1)}ml`;}
    else{V=Math.floor(cap*2)/2; why=`按库内体积上限${cap}ml加浓（浓度${f(a/V,1)}${cu}，说明书内）`;}}
  return {V, conc:a/V, cu, why};
}
function calcAb(id,col){
  const c=ABCFG[id], g=DRUGS[id], suf=col?'2':'';
  const man=col?'abzMan2':'abzMan', qman=col?'abqMan2':'abqMan';
  const ageEl=$('dage_'+id); const ageV=ageEl?parseFloat(ageEl.value):NaN;
  const age=(isFinite(ageV)&&ageV>=0)?ageV:(c.minAge||7);
  const gwEl=$('dgaw_'+id); const gwV=gwEl?parseFloat(gwEl.value):NaN;
  const gw=(isFinite(gwV)&&gwV>=22)?gwV:30;
  const gdEl=$('dgad_'+id); const gdV=gdEl?parseFloat(gdEl.value):NaN;
  const gd=(isFinite(gdV)&&gdV>=0)?gdV:0;
  const ga=gw+gd/7, pma=ga+age/7;
  const sites=col?(c.sites||[]).filter(x=>x.indexOf('口服')>=0):(c.sites||[]).filter(x=>x.indexOf('口服')<0);
  const site=sites.length>1?((($('sit'+suf+'_'+id)||{}).value)||sites[0]):(sites[0]||'');
  const rows=c.schemes[site]||[];
  let row=rows[rows.length-1]||{dose:c.def||20,freq:c.freq||'q12h'};
  for(const r of rows){
    if(r.min!==undefined&&age<r.min)continue;
    if(r.max!==undefined&&age>r.max)continue;
    if(r.gaMax!==undefined&&ga>r.gaMax)continue;
    if(r.gaMin!==undefined&&ga<r.gaMin)continue;
    if(r.pmaMin!==undefined&&pma<r.pmaMin)continue;
    if(r.pmaMax!==undefined&&pma>r.pmaMax)continue;
    row=r; break;
  }
  const bzEl=$('dabz'+suf+'_'+id);
  const bzV=bzEl?parseFloat(bzEl.value):NaN;
  const dose=(S[id][man]&&isFinite(bzV)&&bzV>0)?bzV:row.dose;   /* 剂量空间：默认推荐值，可自调 */
  const fqs=$('fqab'+suf+'_'+id);
  const fq=(S[id][qman]&&fqs&&fqs.value)?fqs.value:row.freq;     /* 频次选择权留给医生 */
  const a=dose*W;
  const rt=site.indexOf('口服')>=0?'口服/鼻饲':(c.route||'静滴');
  const ageline=c.gaUsed?`日龄${age}天 · 胎龄${Math.floor(ga)}周+${Math.round(ga%1*7)}天`:`日龄${age}天`;
  const pmaline=c.pmaDep?` · PMA${Math.floor(pma)}周+${Math.round(pma%1*7)}天`:'';
  /* 配液行：静滴按 ivc 算具体毫升数（推荐值可自选）；即用型直接给毫升；口服列无配液 */
  let prep=[], iv=null;
  if(rt==='静滴'&&c.ivc){
    if(c.ivc.ready){
      const V=a/c.ivc.conc;
      prep=[`即用型${f(c.ivc.conc,2)}mg/ml：${f2(a)}${c.out}＝${f(V,1)}ml，无需稀释`];
      iv={V, conc:c.ivc.conc, cu:'mg/ml', ready:true};
    }else{
      const vEl=$('vabz_'+id);
      const vV=vEl?parseFloat(vEl.value):NaN;
      if(S[id].abvMan&&isFinite(vV)&&vV>0){
        /* 医生自选配液量：按说明书区间校验 */
        const V=vV, conc=a/V, cu=c.ivc.cu||'mg/ml';
        iv={V, conc, cu, man:true};
        prep=[`${c.ivc.preDil?c.ivc.preDil+'加入':''}${c.ivc.base} ${f(V,1)}ml`];
        if(c.ivc.max&&conc>c.ivc.max)iv.why=`⚠ 自选${f(V,1)}ml浓度${f(conc,1)}${cu}，超说明书最高${c.ivc.max}${cu}——请加液稀释`;
        else if(c.ivc.min&&conc<c.ivc.min)iv.why=`⚠ 自选${f(V,1)}ml浓度${f(conc,1)}${cu}，低于说明书最低${c.ivc.min}${cu}——过稀`;
      }else{
        iv=abIv(a,c.ivc);
        prep=[`${c.ivc.preDil?c.ivc.preDil+'加入':''}${c.ivc.base} ${f(iv.V,1)}ml`];
        if(iv.why)iv.why=`⚠ ${iv.why}`;
      }
    }
  }
  const warn=(c.minAge&&age<c.minAge)?[`⚠ 本药适用年龄>${c.minAge}天（当前日龄${age}天），请上级确认`]:[];
  const t1 = (c.ivc&&c.ivc.ready&&rt==='静滴')
    ? `${g.name} ${f2(a)}${c.out}（${f(iv.V,1)}ml） 静滴 ${fq}`
    : (rt==='静滴')
    ? `${g.name} ${f2(a)}${c.out} 静滴 ${fq}`
    : `${g.name} ${f2(a)}${c.out} ${rt} ${fq}`;
  const ck=[...warn, `方案：${site}（${ageline}${pmaline}）→ 推荐 ${f2(row.dose)}${c.unit} ${row.freq}`,
      `剂量核对：${f2(row.dose)}${c.unit} × ${W.toFixed(2)}kg ＝ <b>${f2(a)}${c.out}</b>`];
  if(iv)ck.push(iv.ready
    ?`容量核对：${f2(a)}${c.out} ÷ ${iv.conc}mg/ml ＝ ${f(iv.V,1)}ml（说明书口径：${c.ivc.src}）`
    :`配液核对：${f2(a)}${c.out} ÷ ${f(iv.V,1)}ml ＝ ${f(iv.conc,1)}${iv.cu}${iv.man?'（自选体积）':`（推荐，库内浓度${c.ivc.lc}${iv.cu}）`}——说明书${c.ivc.min||'—'}–${c.ivc.max||'—'}${iv.cu}`);
  if(iv&&iv.why)ck.push(iv.why);
  return {t1,
    prep, rec:row.dose, vol:iv?iv.V:0,
    ck, dose:a};
}
/* 卡内「配液与浓度」常显块（10-14用户定稿：一句话精简，置于主要不良反应下方） */

/* 换血（双倍量=2×血容量；组分=悬浮红细胞:血浆 2:1；库内实录 225ml=150+75、4小时匀速） */
function calcExs(id){
  const bvEl=parseFloat($('din_'+id).value);
  const bv=(isFinite(bvEl)&&bvEl>=60&&bvEl<=150)?bvEl:90;   /* 血容量 ml/kg（早产90–100/足月80–85） */
  const V=Math.round(2*bv*W);
  const rbc=Math.round(V*2/3), pla=V-rbc;
  return {t1:`换血 ${V}ml（悬浮红细胞 ${rbc}ml＋病毒灭活血浆 ${pla}ml，4小时匀速）`,
    prep:[`换出总量＝2×血容量（${f2(bv)}ml/kg × ${W.toFixed(2)}kg）`],
    ck:[`血容量核对：${f2(bv)}ml/kg × ${W.toFixed(2)}kg ＝ <b>${f2(bv*W,1)}ml</b>`,
        `双倍量：2 × ${f2(bv*W,1)}ml ＝ <b>${V}ml</b>（库内实录例：225ml＝红细胞150＋血浆75）`,
        `组分核对：红细胞 ${rbc}ml ： 血浆 ${pla}ml ＝ 2:1（换后复查胆红素/血常规/电解质/血糖）`], dose:V};
}
/* 红细胞输血（本院实测 n=326：每1ml/kg≈Hb+0.1g/dL；计划量上限 20ml/kg 封顶；换血/大输血不在本卡） */
function calcRbc(id){
  const hbEl=parseFloat($('din_'+id).value);
  const hb=(isFinite(hbEl)&&hbEl>0)?hbEl:8;
  const plEl=parseFloat($('dinm_'+id).value);
  const v=Math.min((isFinite(plEl)&&plEl>0)?plEl:10,20);
  const vR=Math.round(v*W);
  const fEl=parseFloat($('dinf_'+id).value);
  const fd=(isFinite(fEl)&&fEl>0)?fEl:0.5;
  return {t1:`输悬浮红细胞 ${vR}ml（${f2(v)}ml/kg，4小时内入）`,
    prep:[`呋塞米针 ${f2(fd*W)}mg（${f2(fd)}mg/kg）静推 once（输一半时）`],
    ck:[`可达 Hb：当前${f2(hb)} ＋ ${f2(v*0.1)} ≈ <b>${f2(hb+v*0.1)}g/dL</b>（本院实测每1ml/kg≈+1g/L；15–20ml/kg段中位+1.8~1.9g/dL）`,
        `容量核对：${f2(v)}ml/kg × ${W.toFixed(2)}kg ＝ ${vR}ml（0.5U≈67.5ml，1U≈135ml）`,
        `额度：${f2(v)}/20ml/kg——每日 top-up 上限，填入超 20 按 20 计`], dose:v};
}

function calcProd(id){
  const c=PRODCFG[id];
  const el=parseFloat($('din_'+id).value);
  let v=(isFinite(el)&&el>0)?el:c.def;
  if(c.max)v=Math.min(v,c.max);
  const fEl=parseFloat($('dinf_'+id).value);
  const fd=(isFinite(fEl)&&fEl>0)?fEl:0.5;
  const furo=[`呋塞米针 ${f2(fd*W)}mg（${f2(fd)}mg/kg）静推 once（输一半时）`];
  const lim=c.hours?`，${c.hours}小时内入`:'';
  if(c.kind==='mlkg'){
    const ml=Math.round(v*W);
    return {t1:`输${c.out} ${ml}ml（${f2(v)}ml/kg${lim}）`, prep:furo, ck:c.ck(v,ml), dose:v};
  }
  if(c.kind==='gkg'){
    const gm=Math.round(v*W*100)/100;
    return {t1:`输${c.out} ${f2(gm)}g（${f2(v)}g/kg${lim}）`, prep:furo, ck:c.ck(v,gm), dose:v};
  }
  const tail=c.hours?`（${c.hours}小时内入）`:'';
  return {t1:`输${c.out} ${f2(v)}${c.unit}${tail}`, prep:furo, ck:c.ck(v), dose:v};
}
function calcResus(rt){
  const d=RES[rt]||((rt==='iv')?0.2:0.75);
  const ml=d*W, mg=ml*0.1;
  const t1= rt==='iv'? `1:10000肾上腺素 ${f2(ml)}ml 静推 st` : `1:10000肾上腺素 ${f2(ml)}ml 气管内滴入 st`;
  const t2= rt==='iv'? `${Math.round(d*100)}μg/kg＝${f2(mg)}mg · q3–5min可重复 · 推注≥1min`
                     : `${f(d,2)}ml/kg＝${f2(mg)}mg · 0.05–0.1mg/kg · 滴后气囊加压数次 · 尽快建立静脉`;
  return {t1,t2,ck:[`剂量核对：${d}ml/kg×${W.toFixed(2)}kg＝<b>${f2(ml)}ml</b>＝${f2(mg)}mg`]};
}

/* 医嘱篮取行：key=id@form[@route]（唯一入口，医嘱单/长图/复制共用） */
function linesOf(key){
  const parts=key.split('@'), id=parts[0], form=parts[1], rt=parts[2];
  if(form==='resus'){const L=calcResus(rt); return {t1:L.t1,prep:[L.t2],ck:L.ck};}
  if(form==='push'){const L=calcPush(id); return {t1:L.t1,prep:L.prep||[],ck:L.ck};}
  if(form==='pump'){const L=calcPump(id); return {t1:L.t1,prep:L.prep,ck:L.ck,load:L.load,maint:L.maint};}
  if(form==='qd'){const L=calcQd(id); return {t1:L.t1,prep:[],ck:L.ck};}
  if(form==='qhm'){const L=calcQd(QDCFG[id].dualWith); return {t1:L.t1,prep:[],ck:L.ck};}
  if(form==='rbc'){const L=calcRbc(id); return {t1:L.t1,prep:L.prep||[],ck:L.ck};}
  if(form==='exs'){const L=calcExs(id); return {t1:L.t1,prep:L.prep||[],ck:L.ck};}
  if(form==='ab'){const L=calcAb(id); return {t1:L.t1,prep:L.prep||[],ck:L.ck};}
  if(form==='ab2'){const L=calcAb(id,'b'); return {t1:L.t1,prep:L.prep||[],ck:L.ck};}
  if(form==='prod'){const L=calcProd(id); return {t1:L.t1,prep:L.prep||[],ck:L.ck};}
  if(form==='load'){const L=calcLoad(id); return {t1:L.t1,prep:[L.t2],ck:L.ck};}
  return S[id].mode==='amp'? calcAmp(id) : calcH24(id);
}

  if(dc.forms.includes('load')){

    qdSec=`<div id="sec_qd_${id}" style="display:${c.form==='qd'?'block':'none'}">
      ${qTabs}

      <div class="labeq">剂量 <div class="stepwrap"><button type="button" class="stp" data-act="step" data-t="dinq_${id}" data-dir="-1">−</button><input data-act="dose" data-card="${id}" id="dinq_${id}" type="number" inputmode="decimal" step="${q.step}" min="0" value="${qdef}"><button type="button" class="stp" data-act="step" data-t="dinq_${id}" data-dir="1">＋</button></div> ${q.unit}</div>

      <div class="btnrow"><button class="btn pri" data-act="add" data-key="${id}@qhm" id="add_${id}_qhm">＋ 加医嘱</button>
        <button class="linklike" data-act="go" data-page="2">查看医嘱单 ›</button></div>
    </div>`;
  }
  /* 复苏区 */
  let resusSec='';
  if(dc.forms.includes('resus')){
    resusSec=`<div id="sec_resus_${id}" style="display:none">
      <div class="spec">配液：<b>1mg＋NS 9ml→10ml</b>（1:10000，现配现用、标注时间）</div>
      <div class="redsec">
        <div class="redsec_t">① 静推（IV/IO）</div>
        <div class="labeq">剂量 <div class="stepwrap"><button type="button" class="stp" data-act="step" data-t="din_${id}_iv" data-dir="-1">−</button><input data-act="resus" data-rt="iv" id="din_${id}_iv" type="number" inputmode="decimal" step="0.05" min="0.05" max="0.3" value="0.2"><button type="button" class="stp" data-act="step" data-t="din_${id}_iv" data-dir="1">＋</button></div> ml/kg（0.1–0.3＝0.01–0.03mg/kg）</div>
        <div class="ordbox" id="ord_${id}_iv"></div>
        <div class="ckbox"><div class="t">核对（体重 <span id="ckw_${id}_iv">—</span>kg）</div><div id="ckr_${id}_iv"></div></div>
        <div class="btnrow"><button class="btn red" data-act="add" data-key="${id}@resus@iv" id="add_${id}_iv">＋ 复苏静推加医嘱</button>
          <button class="linklike" data-act="go" data-page="2">查看医嘱单 ›</button></div>
        <div class="note">q3–5min 可重复；正压通气＋胸外按压下给药；推注≥1min；外渗→酚妥拉明局部浸润</div>
      </div>
      <div class="redsec">
        <div class="redsec_t">② 气管内（ET）—— 无静脉通路时</div>
        <div class="labeq">剂量 <div class="stepwrap"><button type="button" class="stp" data-act="step" data-t="din_${id}_et" data-dir="-1">−</button><input data-act="resus" data-rt="et" id="din_${id}_et" type="number" inputmode="decimal" step="0.05" min="0.5" max="1" value="0.75"><button type="button" class="stp" data-act="step" data-t="din_${id}_et" data-dir="1">＋</button></div> ml/kg（0.5–1＝0.05–0.1mg/kg）</div>
        <div class="ordbox" id="ord_${id}_et"></div>
        <div class="ckbox"><div class="t">核对（体重 <span id="ckw_${id}_et">—</span>kg）</div><div id="ckr_${id}_et"></div></div>
        <div class="btnrow"><button class="btn pri" data-act="add" data-key="${id}@resus@et" id="add_${id}_et">＋ 气管内加医嘱</button></div>
        <div class="note">滴入后气囊加压数次促吸收；吸收不稳定→尽快建立静脉/骨髓腔通路</div>
      </div>
    </div>`;
  }
  return `<div class="card" id="card_${id}">
    <div class="chead" data-act="cap" data-card="${id}">
      <span class="tri" id="tri_${id}">▸</span>
      <span class="ct">${g.name}</span><span class="en">${g.en}</span>
      <span class="cspec">${g.spec}</span>
      <span class="csum">${g.csum||("每支 "+f(g.specMg,2)+"mg")}</span>
    </div>
    <div class="cbody" id="body_${id}" style="display:none">
      ${formTabs}
      ${maintSec}${pushSec}${loadSec||''}${qdSec}${qhmSec}${resusSec}
      ${doseInfoHtml(g)}
      ${moreHtml(g)}
    </div>
  </div>`;
}
/* 首页 7 框：两大类(血管活性/镇静镇痛,带子分类层) + 其余按系统直接一级（2026-10-13 用户拍板撤销"常用治疗药"大筐） */
const L1META=[
  {name:'循环系统用药',icon:'🫀',grps:[0,1,2,14]},
  {name:'神经系统用药',icon:'🧠',grps:[8,9,10,11,4]},
  {name:'呼吸系统用药',icon:'🫁',grps:[7]},
  {name:'消化系统用药',icon:'🍼',grps:[6]},
  {name:'内分泌及代谢用药',icon:'💉',grps:[3,16,17]},
  {name:'血液制品',icon:'🩸',grps:[13]},
  {name:'抗感染用药',icon:'🦠',grps:[18,19,20,21,24,25,22,23]},
  {name:'止血药',icon:'🩹',grps:[12]},
  {name:'利尿药',icon:'💧',grps:[5,15]},
];
function renderCards(){
  $('viewL1').innerHTML=L1META.map((m,mi)=>{
    const grps=m.grps.map(gi=>GROUPS[gi]);
    const n=grps.reduce((a,g)=>a+g.cards.length,0);
    const sub=m.grps.length>1?grps.map(g=>g.title).join(' · '):grps[0].cards.map(id=>DRUGS[id].name).join(' · ');
    const act=m.grps.length>1?`data-act="l1" data-l1="${mi}"`:`data-act="cat" data-grp="${m.grps[0]}"`;
    return `<div class="group" ${act}>
      <div class="ghead"><span class="gico">${m.icon||'⚕'}</span>
        <div class="gmain"><div class="gtitle2">${m.name}</div><div class="gsub">${sub}</div></div>
        <span class="gcnt">${n}</span>
      </div></div>`;

  /* 二级分类页：仅两大类有子分类层 */
  $('viewL2').innerHTML=`<div class="backrow" data-act="backl1">‹ 返回</div>`+
    L1META.map((m,mi)=>m.grps.length>1?`<div id="l2g_${mi}" style="display:none">`+
      m.grps.map(gi=>{const gr=GROUPS[gi];return `<div class="group" data-act="cat" data-grp="${gi}">
        <div class="ghead">
          <span class="gtri">▸</span>
          <div class="gmain"><div class="gtitle2">${gr.title}</div><div class="gsub">${gr.cards.map(id=>DRUGS[id].name).join(' · ')}</div></div>
          <span class="gcnt">${gr.cards.length}</span>
        </div></div>`;}).join('')+`</div>`:'').join('');
  $('viewL3').innerHTML=GROUPS.map((gr,gi)=>`<div id="lwrap_${gi}" style="display:none">
      <div class="backrow" data-act="backcat" data-grp="${gi}">‹ 返回</div>
      <div class="backrow" data-act="backlist" data-grp="${gi}" id="backdrug_${gi}" style="display:none">‹ 返回列表</div>
      <div id="lbody_${gi}">${gr.cards.map(id=>cardHtml(id)).join('')}</div>
    </div>`).join('');
}
/* ===== drill-down：首页7框 → (两大类经分类页) → 药列表 → 详情 ===== */
var view={l1:null, grp:null, drug:null};
function show(a,b,c){
  $('viewL1').style.display=a?'block':'none';
  $('viewL2').style.display=b?'block':'none';
  $('viewL3').style.display=c?'block':'none';
}
function openL1(x){
  view={l1:x, grp:null, drug:null};
  show(false,true,false);
  L1META.forEach((m,mi)=>{ if(m.grps.length>1){const el=$('l2g_'+mi); if(el)el.style.display=mi===x?'block':'none';} });
  window.scrollTo(0,0);
}
function backL1(){
  view={l1:null, grp:null, drug:null};
  show(true,false,false);
  window.scrollTo(0,0);
}
function resetView(){
  if(view.drug)exitDrugSilent();
  if(view.grp!==null)backCat();
  else if(view.l1!==null)backL1();
}
function openCat(gi){
  view.grp=gi;
  show(false,false,true);
  GROUPS.forEach((g,i)=>{$('lwrap_'+i).style.display=i===gi?'block':'none';});
  window.scrollTo(0,0);
}
function backCat(){
  view.grp=null;
  if(view.l1!==null){openL1(view.l1); return;}
  show(true,false,false);
  window.scrollTo(0,0);
}
function enterDrug(id){
  view.drug=id;
  const lb=$('lbody_'+view.grp);
  lb.querySelectorAll(':scope > .card').forEach(el=>el.style.display=el.id==='card_'+id?'block':'none');
  $('backdrug_'+view.grp).style.display='flex';
  setCap(id,true);
  openCap=id;
}
function exitDrugSilent(){
  const id=view.drug, gi=view.grp;
  const body=$('body_'+id);
  if(body){body.style.display='none'; $('tri_'+id).textContent='▸'; $('card_'+id).className='card';}
  $('lbody_'+gi).querySelectorAll(':scope > .card').forEach(el=>el.style.display='block');
  $('backdrug_'+gi).style.display='none';
  openCap=null;
  view.drug=null;
}

/* 单卡刷新：按 S[id].form 所在区刷新 + 摘要 */
function updCard(id){
  if(!S[id])return;
  const g=DRUGS[id];
  /* 单形式药(胰岛素/呋塞米) */
  const dcU=DRUGCARDS.find(x=>x.id===id);
  if(dcU&&dcU.forms.length===1&&dcU.forms[0]==='pump'){
    const L=calcPump(id);
    $('ordl2_'+id).innerHTML=`<div class="o1">${L.load.t1}</div>`;
    $('ckl2_'+id).textContent=L.load.ck;
    $('ordm2_'+id).innerHTML=`<div class="o1">${L.maint.t1}</div>`;
    $('ckm2_'+id).textContent=L.maint.ck;
    $('ord_'+id).innerHTML=`<div class="o1">${L.t1}</div><div class="o2">${L.prep.join('<br>')}</div>`;
    $('ckr_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
    return;
  }
  /* 换血单形式卡 */
  if(dcU&&dcU.forms.length===1&&dcU.forms[0]==='exs'){
    const L=calcExs(id);
    $('ord_'+id).innerHTML=`<div class="o1">${L.t1}</div>${L.prep&&L.prep.length?`<div class="o2">${L.prep.join('<br>')}</div>`:''}`;
    $('ckr_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
    return;
  }
  /* 抗感染专属卡（双剂型卡左右两栏各刷各的；⚠夹线只进卡内预览，不进医嘱） */
  if(dcU&&dcU.forms.length===1&&dcU.forms[0]==='ab'){
    const c=ABCFG[id];
    const dual=(c.sites||[]).some(x=>x.indexOf('口服')<0)&&(c.sites||[]).some(x=>x.indexOf('口服')>=0);
    const renderAbCol=(col)=>{
      const suf=col?'2':'';
      const L=calcAb(id,col);
      if(!S[id][col?'abzMan2':'abzMan']){const bz=$('dabz'+suf+'_'+id); if(bz&&!bz.value)bz.value=L.rec;}
      if(!S[id].abvMan&&!col){const vz=$('vabz_'+id); if(vz&&!vz.value&&L.vol)vz.value=f(L.vol,1);}
      const el=$('ord'+suf+'_'+id);
      if(el)el.innerHTML=`<div class="o1">${L.t1}</div>${L.prep&&L.prep.length?`<div class="o2">${L.prep.join('<br>')}</div>`:''}`
        +(L.prep&&L.prep.length&&L.ck.filter(r=>r.indexOf('⚠')===0).length?`<div class="o2" style="color:#b00020;">${L.ck.filter(r=>r.indexOf('⚠')===0).join('<br>')}</div>`:'');
      const ckr=$('ckr'+suf+'_'+id);
      if(ckr)ckr.innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    };
    renderAbCol(undefined); if(dual)renderAbCol(true);
    document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
    return;
  }
  /* 红细胞输血单形式卡 */
  if(dcU&&dcU.forms.length===1&&dcU.forms[0]==='rbc'){
    const L=calcRbc(id);
    $('ord_'+id).innerHTML=`<div class="o1">${L.t1}</div>${L.prep&&L.prep.length?`<div class="o2">${L.prep.join('<br>')}</div>`:''}`;
    $('ckr_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
    return;
  }
  /* 血制品通用单形式卡 */
  if(dcU&&dcU.forms.length===1&&dcU.forms[0]==='prod'){
    const L=calcProd(id);
    $('ord_'+id).innerHTML=`<div class="o1">${L.t1}</div>${L.prep&&L.prep.length?`<div class="o2">${L.prep.join('<br>')}</div>`:''}`;
    $('ckr_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
    return;
  }
  /* 维持区：未手动改过泵速时,泵速框随剂量自动更新为建议值;手动改过则保持独立 */
  if($('ord_'+id)){
    const h24=calcH24(id), amp=calcAmp(id);
    $('ord_'+id).innerHTML=`<div class="o1">${h24.t1}</div><div class="o2">${h24.prep.join('<br>')}</div>`;
    $('ckr_'+id).innerHTML=h24.ck.map(r=>`<div class="r">${r}</div>`).join('');
    $('aord_'+id).innerHTML=`<div class="o1">${amp.t1}</div><div class="o2">${amp.prep.join('<br>')}</div>`;
    $('ackr_'+id).innerHTML=amp.ck.map(r=>`<div class="r">${r}</div>`).join('');
    var h24R=h24.R, h24D=h24.dose, ampR=amp.R, ampD=amp.dose;
  }
  /* 首剂区 */
  let loadDose=null;
  if($('ordl_'+id)){
    const L=calcLoad(id);
    $('ordl_'+id).innerHTML=`<div class="o1">${L.t1}</div><div class="o2">${L.t2}</div>`;
    $('ckrl_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    loadDose=L.dose;
  }
  /* 单amp药(前列地尔) */
  if(dcU&&dcU.forms.length===1&&dcU.forms[0]==='amp'){
    const amp=calcAmp(id);
    $('aord_'+id).innerHTML=`<div class="o1">${amp.t1}</div><div class="o2">${amp.prep.join('<br>')}</div>`;
    $('ackr_'+id).innerHTML=amp.ck.map(r=>`<div class="r">${r}</div>`).join('');
    document.querySelectorAll('#card_'+id+' [class*=ckw]').forEach(el=>el.textContent=W.toFixed(2));
  }
  /* 静推区 */
  let pushDose=null;
  if(dcU&&dcU.forms.includes('push')){
    const L=calcPush(id);
    $('ordp_'+id).innerHTML=`<div class="o1">${L.t1}</div>${L.prep&&L.prep.length?`<div class="o2">${L.prep.join('<br>')}</div>`:''}`;
    $('ckrp_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
    pushDose=L.dose;
  }
  /* 长嘱维持区 */
  if(dcU&&dcU.forms.includes('qd')){
    const L=calcQd(id);
    $('ordq_'+id).innerHTML=`<div class="o1">${L.t1}</div>`;
    $('ckrq_'+id).innerHTML=L.ck.map(r=>`<div class="r">${r}</div>`).join('');
  }
  /* 血管瘤流程区（普萘洛尔第二形式：引擎药=prnhem） */
  if(dcU&&dcU.forms.includes('qhm')&&QDCFG[id].dualWith){
    const oId=QDCFG[id].dualWith, L2=calcQd(oId);
    $('ordq_'+oId).innerHTML=`<div class="o1">${L2.t1}</div>`;
    $('ckrq_'+oId).innerHTML=L2.ck.map(r=>`<div class="r">${r}</div>`).join('');
  }

/* ================= 搜索（跨两页聚合，DOM 移动保留输入状态） ================= */
var searching=false, curPage=0;
function applySearch(qraw){
  const q=(qraw||'').trim();
  if(!q){exitSearch(); return;}
  searching=true;
  if(view.drug)exitDrugSilent();
  if(view.grp!==null)resetView();
  rehome();
  openCap=null;
  const words=q.toLowerCase().split(/\s+/);
  const hits=DRUGCARDS.filter(dc=>{
    const g=DRUGS[dc.id];
    const hay=(g.name+' '+g.en+' '+(ALIAS[dc.id]||'')).toLowerCase();
    return words.every(w=>hay.indexOf(w)>-1);
  });
  $('holderS').innerHTML='';
  hits.forEach(dc=>{
    const el=$('card_'+dc.id);
    if(el){
      if($('body_'+dc.id).style.display==='none')toggleCap(dc.id,false);
      el.style.display='block';
      $('holderS').appendChild(el);
    }
  });
  $('sEmpty').style.display=hits.length?'none':'block';
  $('pMain').className='page';
  $('p2').className='page';
  $('pS').className='page on';
}
function rehome(){
  GROUPS.forEach((gr,gi)=>{
    const gb=$('lbody_'+gi); if(!gb)return;
    gr.cards.forEach(id=>{const el=$('card_'+id); if(el){el.style.display=''; gb.appendChild(el);}});
  });
  $('holderS').innerHTML='';
  openCap=null;
}
function exitSearch(){
  if(!searching)return;
  searching=false;
  $('q').value='';
  rehome();
  go(curPage);
}

/* ================= 医嘱篮 ================= */
function toggleBasket(key){
  if(basket[key])delete basket[key];
  else{
    const parts=key.split('@'), id=parts[0], form=parts[1], rt=parts[2];
    if(form==='resus'){ if(!(RES[rt]>0))return; }
    else if(form==='ab'||form==='ab2'){
      /* 抗感染卡无 din_ 输入框——守卫改为剂量>0（原 din 守卫使加医嘱按钮在真 DOM 中失效） */
      const L=calcAb(id,form==='ab2'?'b':undefined);
      if(!(L.dose>0))return;
    }
    else{
      /* 按形式直取输入框（qd/qhm 用 dinq_，其余维持/静推/首剂用 din_/dinp_/dinl_——存在性||链在空元素上会短路） */
      let box=null;
      if(form==='qd')box=$('dinq_'+id);
      else if(form==='qhm')box=$('dinq_'+((QDCFG[id]||{}).dualWith||id));
      else box=$('din_'+id)||$('dinp_'+id)||$('dinl_'+id);
      const v=box?parseFloat(box.value):NaN;
      if(!isFinite(v)||v<=0)return;
    }
    basket[key]=1;
  }
  renderBasket(); renderAddBtns();
}
function delItem(k){delete basket[k]; renderBasket(); renderAddBtns();}
/* 从医嘱单跳回对应药物的详情页（自动切到该形式） */
function gotoDrug(key){
  const parts=key.split('@'); let id=parts[0]; const form=parts[1];
  let dc=DRUGCARDS.find(x=>x.id===id);
  if(!dc&&QDCFG[id]&&QDCFG[id].dualHost){id=QDCFG[id].dualHost; dc=DRUGCARDS.find(x=>x.id===id);}  /* 合并卡子药→回宿主卡 */
  if(!dc)return;
  const gi=GROUPS.findIndex(g=>g.cards.includes(id)); if(gi<0)return;
  go(0);  /* 🔴 固定回药物浏览页——go()的页号(pMain/p2)与分类page号(0/1/2)是两套语义，go(dc.page)会让常用治疗药跳进医嘱单、page1白屏 */
  const mi=L1META.findIndex(m=>m.grps.includes(gi)&&m.grps.length>1);
  if(mi>-1)openL1(mi);  /* 大类药先亮分类层，返回键才有正确落点 */
  openCat(gi);
  enterDrug(id);
  if(dc.forms.includes(form))setForm(id,form);  /* 同步sec显示——只改S.form会停在上次的区块 */
}
function renderAddBtns(){
  DRUGCARDS.forEach(c=>{
    c.forms.forEach(fm=>{
      if(fm==='resus'){
        ['iv','et'].forEach(rt=>{
          const b=$('add_'+c.id+'_'+rt); if(!b)return;
          const on=!!basket[c.id+'@resus@'+rt];
          b.className='btn '+(rt==='iv'?'red':'pri')+(on?' added':'');
          b.textContent=on?'✓ 已加医嘱':(rt==='iv'?'＋ 复苏静推加医嘱':'＋ 气管内加医嘱');
        });
        return;
      }
      if(fm==='ab'){
        /* 双剂型分栏：静/口服两个按钮各按各的篮键回显 */
        [['ab',false],['ab2',true]].forEach(([suf,isPo])=>{
          const b=$('add_'+c.id+'_'+suf); if(!b)return;
          const on=!!basket[c.id+'@'+suf];
          b.className='btn pri'+(on?' added':'');
          b.textContent=on?'✓ 已加医嘱':(isPo?'＋ 口服医嘱':(b.dataset.dual?'＋ 静脉医嘱':'＋ 加医嘱'));
        });
        return;
      }
      const b=$('add_'+c.id+'_'+fm); if(!b)return;
      const on=!!basket[c.id+'@'+fm];
      b.className='btn pri'+(on?' added':'');
      b.textContent=on?'✓ 已加医嘱':'＋ 加医嘱';
    });
  });
}
function metaSummary(){
  const gaw=parseFloat(META.gaw), gad=parseFloat(META.gad)||0, dol=parseFloat(META.dol);
  const parts=[];
  if(META.bed)parts.push('床号 '+META.bed);
  if(META.name)parts.push('姓名 '+META.name);
  if(META.hosp)parts.push('住院号 '+META.hosp);
  if(isFinite(gaw)&&gaw>0)parts.push('GA '+gaw+'周+'+gad+'天');
  if(isFinite(dol)&&META.dol!=='')parts.push('日龄 '+dol+'天');
  if(isFinite(gaw)&&gaw>0&&isFinite(dol)&&META.dol!==''){const tt=gaw*7+gad+dol;parts.push('纠正胎龄 '+Math.floor(tt/7)+'周+'+(tt%7)+'天');}
  return parts;
}
function updCga(){
  const gaw=parseFloat(META.gaw), gad=parseFloat(META.gad)||0, dol=parseFloat(META.dol);

}

/* ================= 长图（780px 黑白简框） ================= */
function makeImg(){
  const ks=Object.keys(basket), Wc=780, pad=44, innerW=Wc-2*pad-24;
  const ms=metaSummary();
  const strip=s=>s.replace(/<[^>]+>/g,'');
  const items=ks.map(k=>({k,L:linesOf(k)}));
  function render(H){
    const cv=document.createElement('canvas'); cv.width=Wc; cv.height=H;
    const x=cv.getContext('2d');
    function wrap(txt,xx,yy,maxw,lh,font){x.font=font;var lt='';for(var i=0;i<txt.length;i++){var t2=lt+txt[i];if(x.measureText(t2).width>maxw){x.fillText(lt,xx,yy);lt=txt[i];yy+=lh;}else lt=t2;}if(lt)x.fillText(lt,xx,yy);return yy+lh;}
    x.fillStyle='#fff'; x.fillRect(0,0,Wc,H);
    x.strokeStyle='#000'; x.lineWidth=3; x.strokeRect(14,14,Wc-28,H-28);
    x.fillStyle='#000'; x.font='bold 30px sans-serif'; x.fillText('临时医嘱（药物计算）',pad,64);
    x.font='20px sans-serif'; x.fillText(new Date().toLocaleDateString('zh-CN'),Wc-pad-150,62);
    x.font='16px sans-serif'; x.fillText('体重 '+W.toFixed(2)+'kg'+(ms.length?' · '+ms.join('  '):''),pad,90);
    x.strokeStyle='#000'; x.lineWidth=1; x.beginPath(); x.moveTo(pad,102); x.lineTo(Wc-pad,102); x.stroke();
    var yy=120;
    if(!items.length){x.fillStyle='#666';x.font='22px sans-serif';x.fillText('（未选药物）',pad,yy);yy+=40;}
    items.forEach((it,i)=>{
      var boxTop=yy;
      x.fillStyle='#000'; x.font='bold 20px monospace';
      var yc=wrap((i+1)+'、'+it.L.t1,pad+12,boxTop+28,innerW,28,'bold 20px monospace');
      if(it.L.prep){x.fillStyle='#333';it.L.prep.forEach(pl=>{yc=wrap(pl,pad+12,yc+2,innerW,24,'16px monospace');});}
      var bh=yc-boxTop+10;
      x.strokeStyle='#000';x.lineWidth=1.5;x.strokeRect(pad,boxTop,Wc-2*pad,bh);
      yy=boxTop+bh+8;
      if(it.L.ck&&it.L.ck.length){
        var ckTop=yy;
        x.fillStyle='#555';x.font='bold 13px sans-serif';x.fillText('核对（体重 '+W.toFixed(2)+' kg）',pad+12,ckTop+16);
        yc=ckTop+36;
        it.L.ck.forEach(r=>{x.fillStyle='#222';x.font='14px monospace';yc=wrap(strip(r),pad+12,yc,innerW,22,'14px monospace');});
        var ch=yc-ckTop+8;
        x.strokeStyle='#888';x.lineWidth=1;x.setLineDash([5,4]);x.strokeRect(pad,ckTop,Wc-2*pad,ch);x.setLineDash([]);
        yy=ckTop+ch+10;
      }
    });
    return {cv,yyEnd:yy};
  }
  const p1=render(3000);
  const H=Math.max(600,p1.yyEnd+60);
  const cv=render(H).cv;
  const x=cv.getContext('2d');
  x.fillStyle='#555';x.font='13px sans-serif';
  x.fillText('生成于 '+new Date().toLocaleString('zh-CN')+' · 上框=医嘱+24小时量 下框=核对 · 须上级医师核对后录入HIS',pad,H-30);
  $('imgPrev').src=cv.toDataURL('image/png'); $('imgPrev').style.display='block';
  cv.toBlob(function(blob){
    if(!blob)return;
    var file=null; try{file=new File([blob],'医嘱_'+W.toFixed(2)+'kg.png',{type:'image/png'});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'医嘱'}).catch(function(){});return;}
    var a=document.createElement('a'); a.download='医嘱_'+W.toFixed(2)+'kg.png'; a.href=URL.createObjectURL(blob);
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
  },'image/png');
}

/* ================= 步进按钮（−/+,长按连续） ================= */
var stepTimer=null, stepIv=null, stepLong=false;
function doStep(b){
  const t=document.getElementById(b.dataset.t); if(!t)return;
  const step=parseFloat(t.step)||1, min=parseFloat(t.min)||0;
  const cur=parseFloat(t.value);
  let v=(isFinite(cur)?cur:0)+step*parseInt(b.dataset.dir,10);
  v=Math.max(min,Math.round(v/step)*step);
  v=parseFloat(v.toFixed(4));
  if(t.max!==undefined&&v>parseFloat(t.max))v=parseFloat(t.max);
  t.value=String(v);
  t.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-act="step"]'); if(!b)return;
  stepLong=false;
  stepTimer=setTimeout(()=>{ stepLong=true; stepIv=setInterval(()=>doStep(b),110); },380);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,()=>{
  clearTimeout(stepTimer); if(stepIv){clearInterval(stepIv); stepIv=null;}
}));
/* ================= 事件委托（document 级，无逐元素监听） ================= */
function onInputLinkage(e){
  const t=e.target;
  if(t.id==='q'){applySearch(t.value); return;}
  if(t.id==='wt'){
    const v=parseFloat(t.value); if(!isFinite(v))return;
    W=Math.min(6,Math.max(0.4,v));
    $('wtNow').textContent='按 '+W.toFixed(2)+'kg 计算';
    try{localStorage.setItem('vasoW',String(W));}catch(err){}
    updateAll(); return;
  }
  if(t.dataset.meta!==undefined&&t.dataset.meta!==''){
    const k=t.dataset.meta; META[k]=t.value;
    try{localStorage.setItem('vasoMeta',JSON.stringify(META));}catch(err){}
    updCga(); renderBasket(); return;
  }
  if(t.id.indexOf('dabz_')===0){const cid=t.dataset.card; S[cid].abzMan=true; /* 剂量变动→配液量重置为推荐 */
    S[cid].abvMan=false; const vz=$('vabz_'+cid); if(vz)vz.value=''; updCard(cid); return;}
  if(t.id.indexOf('dabz2_')===0){S[t.dataset.card].abzMan2=true; updCard(t.dataset.card); return;}
  if(t.id.indexOf('vabz_')===0){S[t.dataset.card].abvMan=true; updCard(t.dataset.card); return;}
  if(t.id&&(t.id.indexOf('dage_')===0||t.id.indexOf('dgaw_')===0||t.id.indexOf('dgad_')===0)){
    /* 日龄/胎龄变动：双栏剂量空间与配液量一并重置为推荐值 */
    const cid=t.dataset.card; S[cid].abzMan=false; S[cid].abzMan2=false; S[cid].abvMan=false;
    ['dabz_','dabz2_','vabz_'].forEach(p=>{const el=$(p+cid); if(el)el.value='';});
  }
  const a=t.dataset.act;
  if(a==='dose'||a==='rate'||a==='amprate'||a==='loadrate'){
    if(a==='rate'||a==='amprate')S[t.dataset.card].rateTouched=true;
    const isMaintDose=t.id.indexOf('din_')===0;  /* 仅维持剂量框触发联动；dinp_(静推/负荷)/dinl_(首剂)不得改泵速 */
    if(a==='dose'&&isMaintDose&&!S[t.dataset.card].rateTouched){
      /* 单向联动：调剂量→液速自动更新为建议值；手动改过液速则尊重手动值 */
      const id=t.dataset.card, g=DRUGS[id], d=parseFloat(t.value);
      if(isFinite(d)&&d>0){
        if(g.dynamic){ const r=$('rin_'+id); if(r)r.value=f2(d/10); }
        else{ const sug=f2(niceRate(id==='glucagon'?d*W*16.8/1000:rateOf(d,g)));
          const r=$('rin_'+id); if(r)r.value=sug;
          const ar=$('arin_'+id); if(ar)ar.value=sug; }
      }
    }
    updCard(t.dataset.card);
  }
  else if(a==='resus'){updCard('epi');}
}

    case 'qmode': QMODE[b.dataset.card]=b.dataset.mode;
      document.querySelectorAll('#qm_'+b.dataset.card+' button').forEach(x=>x.className=x.dataset.mode===b.dataset.mode?'on':'');
      { const c2=QDCFG[b.dataset.card], mm=(c2.modes||[]).find(m=>m.k===b.dataset.mode);
        const inp=$('dinq_'+b.dataset.card); if(mm&&inp)inp.value=mm.def; }
      updCard((QDCFG[b.dataset.card]||{}).dualHost||b.dataset.card); break;
    case 'prmode': PRMODE[b.dataset.card]=b.dataset.mode;
      document.querySelectorAll('#pr_'+b.dataset.card+' button').forEach(x=>x.className=x.dataset.mode===b.dataset.mode?'on':'');
      updCard(b.dataset.card); break;
    case 'add': toggleBasket(b.dataset.key); break;
    case 'del': delItem(b.dataset.key); break;
    case 'editdrug': gotoDrug(b.dataset.key); break;
    case 'step': if(stepLong){stepLong=false; break;} doStep(b); break;
    case 'go': go(parseInt(b.dataset.page,10)); break;
    case 'copy': copyOrder(); break;
    case 'img': makeImg(); break;
    case 'print': window.print(); break;
  }
});

/* 滚动收缩 header（Liquid Glass 式）：大标题淡出只留体重行 */
window.addEventListener('scroll',()=>{
  if(window._raf)return; window._raf=true;
  requestAnimationFrame(()=>{
    window._raf=false;
    const h=document.querySelector('header'), y=window.scrollY;
    /* 迟滞带：>80 收起、<30 展开，避免阈值附近抖动闪屏 */
    if(y>80)h.className='compact';
    else if(y<30)h.className='';
  });
},{passive:true});

/* ================= 启动 ================= */
(function init(){
  let sv=NaN;
  try{sv=parseFloat(localStorage.getItem('vasoW'));}catch(e){}
  if(isFinite(sv))$('wt').value=sv;
  const wv=parseFloat($('wt').value); if(isFinite(wv))W=Math.min(6,Math.max(0.4,wv));
  $('wtNow').textContent='按 '+W.toFixed(2)+'kg 计算';
  try{
    const m=JSON.parse(localStorage.getItem('vasoMeta')||'{}');
    Object.keys(META).forEach(k=>{if(m[k])META[k]=m[k];});
  }catch(e){}
  document.querySelectorAll('[data-meta]').forEach(el=>{el.value=META[el.dataset.meta]||'';});
  renderCards();
  updCga();
  updateAll();
})();
</script>
